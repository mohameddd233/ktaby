<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#5c3d1f" />
<title>كتابي — نظام إنشاء الكتب الاحترافي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #8b5e34;
    --primary-dark: #5c3d1f;
    --primary-light: #b8895a;
    --accent: #d4a373;
    --bg: #f5f0e8;
    --card: #ffffff;
    --text: #2d2416;
    --muted: #8a7a68;
    --border: #e0d5c2;
    --danger: #c0392b;
    --success: #27ae60;
    --info: #3498db;
    --nav-h: 60px;
    --shadow-sm: 0 2px 8px rgba(139,94,52,0.08);
    --shadow-md: 0 4px 16px rgba(139,94,52,0.12);
    --shadow-lg: 0 10px 40px rgba(139,94,52,0.18);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .navbar {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: var(--nav-h);
  }
  .navbar h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; font-weight: 900; }
  .navbar h1 span { font-size: 24px; }
  .nav-actions { display: flex; gap: 8px; }

  .btn {
    padding: 12px 18px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
    min-height: 44px;
    user-select: none;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--primary-dark); }
  .btn-primary:hover:not(:disabled) { background: #e0b083; }
  .btn-light { background: rgba(255,255,255,0.2); color: white; }
  .btn-light:hover { background: rgba(255,255,255,0.3); }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .btn-outline:hover { background: var(--primary); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-info { background: var(--info); color: white; }
  .btn-sm { padding: 8px 12px; font-size: 13px; min-height: 38px; }
  .btn-xs { padding: 6px 10px; font-size: 12px; min-height: 32px; border-radius: 6px; }
  .btn-icon { padding: 8px; width: 40px; height: 40px; }

  .container { max-width: 1300px; margin: 0 auto; padding: 16px; width: 100%; flex: 1; }

  .library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .library-header h2 { font-size: 22px; color: var(--primary-dark); }
  .library-header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .book-card {
    background: var(--card);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
  }
  .book-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .book-cover {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 40px;
    font-family: 'Amiri', serif;
    position: relative;
    overflow: hidden;
  }
  .book-cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.15), transparent 15%, transparent 85%, rgba(0,0,0,0.15));
    pointer-events: none;
  }
  .book-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
  .book-info h3 {
    font-size: 14px;
    margin-bottom: 4px;
    color: var(--primary-dark);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-info .author { font-size: 12px; color: var(--muted); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-info .meta { font-size: 11px; color: var(--muted); margin-top: auto; display: flex; justify-content: space-between; }

  .card-actions {
    display: flex;
    gap: 6px;
    padding: 8px;
    background: #faf6ef;
    border-top: 1px solid var(--border);
  }
  .card-actions .btn { flex: 1; padding: 8px 4px; font-size: 12px; min-height: 38px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--primary-dark); }
  .empty-state p { margin-bottom: 20px; }

  .editor-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }

  .panel {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
  }
  .panel h3 {
    color: var(--primary-dark);
    font-size: 16px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }
  .form-group input[type="text"],
  .form-group input[type="number"],
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 16px;
    background: #fdfcf9;
    transition: border 0.2s;
    color: var(--text);
    min-height: 46px;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--accent);
    background: white;
    box-shadow: 0 0 0 3px rgba(212,163,115,0.15);
  }
  .form-group textarea { resize: vertical; min-height: 120px; line-height: 1.7; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  input[type="color"] { width: 100%; height: 46px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; padding: 4px; background: white; }
  input[type="range"] { width: 100%; accent-color: var(--primary); height: 32px; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); vertical-align: middle; margin-left: 6px; }

  .chapter-item {
    background: #fdfcf9;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .chapter-item:hover { box-shadow: var(--shadow-sm); }
  .chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: #f5efe4;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    color: var(--primary-dark);
    min-height: 50px;
    gap: 8px;
  }
  .chapter-header span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .chapter-body { padding: 12px; display: none; }
  .chapter-item.open .chapter-body { display: block; }

  .stats-box {
    background: linear-gradient(135deg, #f5efe4, #faf6ef);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 14px;
  }
  .stats-box h4 { font-size: 14px; color: var(--primary-dark); margin-bottom: 10px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-item {
    background: white;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stat-item span:first-child { color: var(--muted); }
  .stat-item span:last-child { color: var(--primary-dark); font-weight: 700; }

  .preview-page {
    background: white;
    padding: 30px;
    border-radius: 4px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 16px;
    min-height: 400px;
    position: relative;
    line-height: 1.8;
    overflow-wrap: break-word;
  }
  .preview-page.lined {
    background-image: repeating-linear-gradient(transparent, transparent 33px, #e5e7eb 34px);
    background-position: 0 30px;
  }
  .preview-page.dotted {
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .preview-page.vintage { background: #f5ecd7; }

  .preview-header, .preview-footer { font-size: 12px; color: #888; text-align: center; padding: 8px 0; }
  .preview-footer { border-top: 1px solid #eee; margin-top: 20px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: white;
    border-radius: var(--radius-lg);
    max-width: 1200px;
    width: 100%;
    max-height: 94vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    gap: 10px;
  }
  .modal-header h3 { color: var(--primary-dark); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .close-btn {
    background: rgba(0,0,0,0.05);
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--muted);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .close-btn:hover { background: rgba(0,0,0,0.1); color: var(--primary-dark); }

  .book-viewer {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
    min-height: 600px;
    perspective: 3000px;
  }

  .flipbook {
    position: relative;
    width: 800px;
    height: 560px;
    margin: 0 auto;
    transform-style: preserve-3d;
    perspective: 2500px;
    transition: transform 0.5s ease;
  }

  .flipbook .leaf {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1),
                opacity 0.5s ease;
    cursor: pointer;
    will-change: transform;
  }

  .flipbook[data-dir="ltr"] .leaf {
    left: 50%;
    right: auto;
    transform-origin: left center;
    transform: rotateY(0deg);
  }
  .flipbook[data-dir="ltr"] .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .flipbook[data-dir="rtl"] .leaf {
    right: 50%;
    left: auto;
    transform-origin: right center;
    transform: rotateY(0deg);
  }
  .flipbook[data-dir="rtl"] .leaf.flipped {
    transform: rotateY(180deg);
  }

  .flipbook .leaf .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
  }

  .flipbook[data-dir="ltr"] .leaf .face.front { border-radius: 4px 0 0 4px; }
  .flipbook[data-dir="ltr"] .leaf .face.back  { transform: rotateY(-180deg); border-radius: 0 4px 4px 0; }
  .flipbook[data-dir="rtl"] .leaf .face.front { border-radius: 0 4px 4px 0; }
  .flipbook[data-dir="rtl"] .leaf .face.back  { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }

  .flipbook .leaf .page-content {
    flex: 1;
    padding: 32px;
    overflow: hidden;
    line-height: 1.9;
    overflow-wrap: break-word;
    word-wrap: break-word;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-sizing: border-box;
  }

  .flipbook .leaf .page-header {
    font-size: 11px;
    color: #999;
    text-align: center;
    padding: 0 0 10px;
    flex-shrink: 0;
  }

  .flipbook .leaf .page-footer {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    padding: 10px 0 0;
    border-top: 1px solid #eee;
    flex-shrink: 0;
  }

  .flipbook .leaf .page-num {
    position: absolute;
    bottom: 12px;
    font-size: 12px;
    color: #999;
    pointer-events: none;
  }
  .flipbook[data-dir="ltr"] .leaf .face.front .page-num { left: 20px; }
  .flipbook[data-dir="ltr"] .leaf .face.back .page-num { right: 20px; }
  .flipbook[data-dir="rtl"] .leaf .face.front .page-num { right: 20px; }
  .flipbook[data-dir="rtl"] .leaf .face.back .page-num { left: 20px; }

  .flipbook-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #d8cfb8, #f5efe4, #d8cfb8);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }

  .flipbook-bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 6px;
    height: 100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.05), rgba(0,0,0,0.15));
    transform: translateX(-50%);
    z-index: 1;
  }

  .cover-full {
    position: absolute !important;
    inset: 0;
    padding: 0 !important;
    margin: 0 !important;
    background: #000;
    border-radius: inherit;
    overflow: hidden;
  }

  .cover-full img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .flipbook.closed .leaf:not([data-index="0"]) {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  .flipbook.closed .leaf[data-index="0"] {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .flipbook[data-dir="rtl"].closed .leaf[data-index="0"] {
    right: 50%;
    left: auto;
    transform-origin: right center;
    transform: rotateY(0deg);
  }

  .flipbook[data-dir="ltr"].closed .leaf[data-index="0"] {
    left: 50%;
    right: auto;
    transform-origin: left center;
    transform: rotateY(0deg);
  }

  .flipbook.closed::after {
    content: '';
    position: absolute;
    top: 3%;
    bottom: 3%;
    width: 50%;
    pointer-events: none;
    z-index: 500;
    border-radius: inherit;
  }
  .flipbook[data-dir="rtl"].closed::after {
    right: 50%;
    background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, transparent 8%);
  }
  .flipbook[data-dir="ltr"].closed::after {
    left: 50%;
    background: linear-gradient(270deg, rgba(0,0,0,0.5) 0%, transparent 8%);
  }

  @keyframes coverPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0,0,0,0.15); }
    50% { box-shadow: 0 0 40px rgba(212,163,115,0.5); }
  }

  .flipbook.closed .leaf[data-index="0"] .face.front {
    animation: coverPulse 2.5s ease-in-out infinite;
  }

  .flipbook.closed .leaf[data-index="0"] .face.front:hover {
    animation: none;
    box-shadow: 0 0 50px rgba(212,163,115,0.8);
  }

  .flipbook .leaf .face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(270deg, rgba(0,0,0,0.15), transparent 20%);
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  .flipbook .leaf.flipped .face.front::after {
    opacity: 0;
  }

  .book-viewer.mobile-mode .flipbook {
    width: 100%;
    max-width: 400px;
    height: 78vh;
    min-height: 480px;
  }
  .book-viewer.mobile-mode .flipbook .leaf {
    width: 100%;
  }
  .book-viewer.mobile-mode .flipbook[data-dir="ltr"] .leaf {
    left: 0;
    right: auto;
  }
  .book-viewer.mobile-mode .flipbook[data-dir="rtl"] .leaf {
    right: 0;
    left: auto;
  }
  .book-viewer.mobile-mode .flipbook .leaf .page-content {
    padding: 20px;
    font-size: 15px;
  }
  .book-viewer.mobile-mode .flipbook-bg::before {
    display: none;
  }
  .book-viewer.mobile-mode .flipbook.closed::after {
    display: none;
  }

  .viewer-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .viewer-controls .btn { min-width: 140px; }
  .viewer-controls .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .page-indicator {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-top: 12px;
    font-weight: 600;
    min-height: 20px;
  }

  .cover-preview {
    width: 100%;
    aspect-ratio: 3/4;
    max-height: 260px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
    background: #faf6ef;
    transition: all 0.2s;
  }
  .cover-preview:hover { border-color: var(--accent); background: #f5efe4; }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }

  .site-footer {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    text-align: center;
    padding: 18px 16px;
    font-size: 13px;
    margin-top: auto;
  }
  .site-footer strong { color: var(--accent); font-weight: 700; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: #f5efe4;
    padding: 4px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    color: var(--muted);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
    transition: all 0.2s;
    user-select: none;
  }
  .tab:hover { color: var(--primary-dark); }
  .tab.active { background: white; color: var(--primary-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--primary-dark);
    color: white;
    padding: 12px 22px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 14px;
    z-index: 2000;
    transition: transform 0.3s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }

  .fab {
    position: fixed;
    bottom: 90px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    font-size: 26px;
    box-shadow: 0 8px 24px rgba(139,94,52,0.4);
    cursor: pointer;

function saveBooks(books) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(books));

function getBook(id) { return getBooks().find(b => b.id === id); }

  if (idx >= 0) books[idx] = book; else books.unshift(book);
  saveBooks(books);
  _pagesCache.delete(book.id);
}
function deleteBook(id) {

}
function escapeHtml(s='') {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'

}
function debounce(key, fn, delay = 400) {

/* ============================================================

function detectTextDirection(text) {
  if (!text) return 'rtl';
  const rtlChars = (text.match(/[\u0591-\u07FF\uFB1D-\uFDFD\uFE70-\uFEFC]/g) || []).length;
  const ltrChars = (text.match(/[A-Za-z]/g) || []).length;
  if (rtlChars === 0 && ltrChars === 0) return 'rtl';
  return rtlChars >= ltrChars ? 'rtl' : 'ltr';
}

function detectBookDirection(book) {
  const d = book.design || {};
  if (d.autoDirection === false && d.direction) return d.direction;
  const sample = [
    book.title || '',
    book.author || '',
    ...(book.chapters || []).slice(0, 3).map(c => (c.content || '').slice(0, 300))
  ].join(' ');
  return detectTextDirection(sample);
}

هي مُمتنة لصدفةٍ جمعتها بتلك السيدة، لم يأتِ في حسبانها يومًا أنها ستُساهم في تحسين وضع مريض، لكن حينما ترجتها صديقتها لمجاورة كارو لحين عودة ابنتها لم تستطع الرفض.

هكذا القدر يجمعنا بأشخاصٍ تهرعُ إليهم قلوبُنا، ثم يحيلُ بيننا الطرق، ليبقوا أبد الدهر عالقين في أذهاننا.


تنهدت تُغلق الباب خلفها.. وكادت أن تخطو خطوة نحو أي طريقٍ يوصلها لفندقٍ مناسب ليومين أو ربما ثلاثة، فلا رغبة لديها للعودة إلى الديار، فبيتُ المرءِ يصبحُ داءً في كثيرٍ من الأوقات، لكن..

"إيلاف!" صوتٌ مألوفٌ اخترق دائرتها.

"فلورا!"

"اشتقتُ لكِ يا فتاة" نبست فلورا تُعانقها.

صديقتها منذ المرحلة الثانوية، لكن فرقت الأيام بينهما وذهبت مارلين خارج البلاد مع عائلتها، لم يكن بينها قرابة صداقة أو رابطة قوية.. حتى أن إيلاف جذعت من شدة العناق!

"منذ متى وأنتِ في بريطانيا؟" سألتها إيلاف بعدما تبادل كلاهما الأحضان.

"جئتُ من أسبوعين"

أومأت لها إيلاف وعلى وشك التلفظ باللقاء اللاحق، لكن سبقتها فلورا: "إلى أين؟"

"ذاهبة للمنزل" كذبةٌ بيضاء.

تجعد حاجبيها باستغرابٍ وهي تنظر للحقيبة بجانبها، هي كاذبة فاشلة.

"لكن هذا ليس الطريق، ألا تمكثين مع السيدة إليانور؟"

وها هي تنعطف لما يؤلمها من جديد.

"ذلك شيء يطول شرحه، الأهم أنني الآن في رحلةِ البحث عن غرفةٍ ملائمةٍ لسببٍ ما"

"لا تهتمي الآن، أخبريني هل أنتِ بخير؟"

أومأت إيلاف وعلامات الاستفهام تلوح أمام وجهها، فلورا تهتم لتلك الدرجة! بل وهل يبدو الإرهاق على محياها واضحًا؟

"لدي صديقة كانت تبحثُ عن مستأجر لغرفةٍ في منزلها، يمكنني التحدث معها لأجلكِ إن أردتِ"

نفت إيلاف بيدها بهدوءٍ وهي تقول: "شكرًا لكِ، سأمكث في فندقٍ ما ريثما ألتحقُ بالجامعة فأقدم في السكن الجامعي."

ومُجددًا تجعد وجه فلورا باستغرابٍ: "ألستِ فيها بالفعل؟ لقد كان مجموعكِ عاليًا حسبما أتذكر"

وهُنا بهتت ملامحها بشكلٍ مُبالغٍ، وكأن الحياة أرسلت لها تلك الفتاة لتُلقي الصخور فوق قلبها واحدةً تلو الأخرى..

وحينما لم تجد إجابة تطرقت لموضوعٍ آخر: "لا بأس صدقيني، ستُحب وجودكِ، تعالي معي لنذهب لها الآن".

"الآن؟! لا أودُّ حقًا لستُ أثق في المبيت عند أحدٍ، إن كانت غُرفةً منعزلةً لربما وافقت."

رفعت فلورا حاجبها تُشير بعينها نحو الباب من خلفهم.

"آه.. هذا منزل خالة صديقتي."

"ألا تثقين بي؟" نبست تتصنع الدهشة وهي تشير بأصابعها نحو ذاتها.

لكن تنهدت إيلاف بقلةِ حيلة تجرُّ حقيبتها خلفها.

"لنذهب."

ليس وكأنها خضعت ببساطة، لكن لا ضرر من الذهاب، لعل المنزل يكون جيد وصاحبته كذلك، ففي النهاية هي بلا مأوى الآن.

أليس كذلك؟


تدفعنا الحياة لطرقٍ لا ندرك نهايتها ولا نعرف كيف نسير بها، فإما أن يصبح الطريق دافعًا للخير، أو يصبح ممتلئًا بالآفاتِ والأشواك..

وربما هنا، اليوم والآن هي دفعت نفسها نحو وعرٍ من الثعابين السامة، فدائمًا ما تجري الرياح بما لا تشتهي السُفن.

                         -إيلاف-

ذهبتُ معها كما رغبت ولعل هنالك غرفة تناسبني لبضعِ ليالٍ.

"وصلنا!" نبست بعدما توقف فجأة.

 بسبب شرودي لم أكن ألاحظ لولا قولها ذلك.

نظرتُ حولي أبحث عن منزلٍ ما أو حتى مسكن، لكن لا يوجد.

نظرت لوجهها وعلامات الاستفهام تملأ وجهي، عكس وجهها الذي تملؤه سعادة غريبة.

لم أكن أعرف أن مساعدتي تشكل تلك الفرحة الظاهرة!

"ها هو، انظري" نبست تُشير نحو رُكنٍ ما، لكن..

كيف تُسمي ذلك منزل! لم يكن بيتًا حتى كما توقعت، بل قصرًا تفوح منه رائحة الثراء، له هالة غير مريحة في النفسِ، وكبيرٌ كما لو أنَّ بريطانيا بأكملها تسكن داخله، ظننته مكانٌ تبع الحكومة البريطانيا للوهلةِ الأولى.


"تقصدين ذلك القصر، حقًّا؟" نبرة التفاجؤ في صوتي غلبتني.. توقعتُ منزلًا فخمًا نوعًا ما لأنَّ فلورا أصدقاءها من ذات المستوى المادي، لكن ليس لتلك الدرجة.

أومأت برأسها ببساطة، فبدأ القلق يتسلل لقلبي وعقلي يأمر بالرفض والبعد.

"لِمَ قد ترغب صاحبة القصر في تأجير غرفة، توقعت أن تكون امرأة في حاجةٍ للمال، فمن قد يرغب في مشاركة منزله مع غرباء؟" سألت أعرض عليها مخاوفي وقلقي.

"لا علم لي بالتفاصيل، لكن لا ضرر من التجربة، إنها صديقتي لذلك لا داعي للقلق"

لكنها لا تعلم أن ذلك موطن القلق.

"تعالي" نبست بعدما ترجلت من السيارة واتجهت لمقعدي فاتحةً الباب، مُمسكةً بيدي تدفعني نحو التقدمِ خارجها.. فسرت معها، ليس خضوعًا أو أنني ملوغبةٌ على أمري.

لكن في داخلي فضولٌ يدفعني نحو الداخل حتى وإن كان الخوف يُعرقلني.

سِرنا سويًا نحو المكان، الحديقة ليست كبيرة لكن قطعنا نفسًا طويلًا لنصل للباب، حتى البيوت المُحيطة تبدو هادئة وكأن لا سُكان لها.

طرقت هي الباب وثغرها يكادُ يتوسع من كثرةِ التبسُم، فتحت لنا سيدة في عقدها السادس ربما، استقبلتنا للداخل، أظنها عاملة المنزل.

لم أملك طاقةً لتحليل كل نقطةٍ بعيني، لكنه من الداخل بارد، أرسل في جسدي شعورًا من التردد، وكأنه خاوٌّ رغم وسعه، أساسه الفخم، جدرانه التي تبدو وكأنها جدرانٌ من الذهبِ.

فعاد عقلي يرسل لي ذات السؤال: لِمَ قد ترغب مالكته في تأجير غرفة؟


نجلسُ وبين أيدينا كوب من المشروب الساخن، لا رغبة لي في التجرع منه ولو نطفة، وكأني فقدتُ شهيتي نحو كلِّ شيءٍ.

وقطع نظراتي نحو نيران المدفأة صوت حذاء عالٍ يطرقُ على الأرضِ مقتربًا نحونا.. وحينها وقفت فلورا، ففعلتُ المثل واضعةً الكوب فوق الطاولة.

اقتربت امرأة وكانت صورةً من الجمال، رقيقة، ابتسامتها دافئة على القلب، ولها رائحة تسبقها في خُطاها.

أظن أنها في عقدها الثالث.

مدت يدها بهدوء لفلورا، أما هي ففعلت ذلك بحفاوةٍ وحماسٍ، وكأنها صداقة من طرفٍ واحد.

"تلك إيلَاف صديقتي من المرحلة الثانوية، أخبرتها عن الغُرفة التي تستأجريها."

أشارت تُعرفها عليّ، فمدَّت المرأة يديها للترحيب: "أهلًا بكِ، أنا مارلين"

ابتسمتُ لها أهزُ رأسي بترحيب، وبلا سبب قد مالَ قلبي لها.

كانت على وشك أن تتفوه بشيءٍ لكن قاطعتها فلورا: "سأذهب الآن لأنَّ والدتي تنتظرني، أركما لاحقًا"

كان ذلك سريعًا حيثُ لوحت بيديها وذهبت بالفعل، لا أشعر باطمئنانٍ تجاه ذلك الموقف، تبدو لي غريبةً، لكني أثقُ بها نوعًا ما، لم أرَ منها يومًا شيئًا سيئًا.

"حسنًا إذًا يُمكنني أن أُرشدكِ للغرفة إذا أردتِ وفي الصباح نأخذ جولة في المنزل"

ألم يؤلمها فكها من الابتسام! إنها بشوشة الوجه بشكلٍ لا يُصدق.

وكأن كل شيء يدفعني للقلق والاطمئنان.

"ألن نتفقُ أولًا على التفاصيل؟ الأموال مثلًا" سألتُ بفضولٍ حاولتُ اخفاءه، نَعم من الواضح عدم اهتمامها بالمال أو ربما حتى ما قد تجنيه مني لا يُساوي شيئًا لها، لكن أليسَ هذا دافعها الوحيد؟

"لا تتعجلي، غدًا نتحدثُ في كل شيء، سيبدو موقفًا سيئًا في حقي التحدث الآن؛ ظاهرٌ عليكِ الإرهاق وأنا أيضًا أفتقدُ فراشي"

ابتسمتُ لها أومئ بهدوء، وهي وقفت تسيرُ فتبعتُها حتى وصلنا للغرفةِ المنشودة.

المنزلُ طابق واحد مُتعدد الغُرف، وفي الأسفلِ لمحتُ غُرفتين ونحنُ نصعدُ.

"أتمنى أن تنال اعجابكِ"

غُرفة مُريحة للعين بألوانها، تنسيقها وأساسُها مُرتب بدقةٍ، تبدو مثالية حتى، بل ومساحتها واسعة، هنالك مِرحاض أيضًا.

"رائعة!"

"سُررتُ بذلك، سأذهب للنومِ الآن إن أردتِ شيئًا يكفي أن تطرقي باب غُرفتي تلك التي بجانبك، نومي خفيفٌ لا تقلقي"

"حسنًا شُكرًا لكِ"

ودعتني بابتسامةٍ بسيطة ثم ذهبت مُغلقة الباب خلفها، فشرعتُ أتأمل الغرفة بعينٍ مُتمعنةٍ تلك المرة.. وقدماي ذهبت للمكتبِ أتفحصه عن قرب حتى أنني فتحتُ أدراجه لعلي أجد شيئًا تابع لصاحبِ الغرفة.. لكن لم أجد.

كان تفكيرًا ساذجًا في النهاية، فمن قد يُأجرُ غرفةً دون تفريغ محتوياتها الخاصة!

لكن ما لفت انتباهي وجود غُبار بسيط على ذلك المكتب، وكأنه مهجورٌ منذ فترة عكس الغرفة التي تعكسُ النظافة الشديدة.

لم أهتم لشيءٍ أخر بل ألقيتُ جسدي على الفراش أغرقُ في التفكير.


لم أشعرُ بنفسي إلا وأنا أستيقظُ على صوتِ ارتطام صاخب.

لا أعرف متى وكيف نمتُ، بل ظننتُ أن النومَ لن يزور أجفاني بسبب القلق وتغيير المكان، لكن عكسما توقعتُ نمتُ بعمقٍ غريب، وكأن المكان مألوفٌ.

لفت انتباهي حقيبتي، لقد كانت في الأسفل أمس، ربما أتت بها مارلين.

تذكرتُ صوت الارتطام الذي تسبب في فزعي، نزلتُ وقد كان المكان مُعتم، ظننتُ الصباح قد حلَّ وإذ بها الساعة الخامسة صباحًا فقط.

لكن ما سبب الصوت.. لا يوجد شيء أو!

هنالك صوت خلفي، خشخشات غير مفهومة وصوت بدا اي كخطواتٍ حريصة.. نبضات قلبي بدأت تتزايدُ وعقلي يرفضُ أن يأمر جسدي بالالتفات، حتى انتشرَ مُجددًا ذات الصوت الذي أيقظني.

كان ذلك كافيًا لأهرول سريعًا نحو الغرفة دون النظر خلفي، بل وأغلقتُ على نفسي وشددتُ على الغطاء لأخفي نفسي.

والآن بدأ الندم يصفعُ عقلي من جميع الجهات.


استيقظتُ على طرقاتٍ خفيضةٍ لباب الغرفة.

ما سر ذلك الفراش حقًّا؟ دائمًا يُجافيني النوم خِلسةً وأنا فوقه، لستُ ممن يضع رأسه على الوسادةِ فينام!

"إيلاف؟"

سمعتُ الطارق يُنادي باسمي، لكن ذلك ليس صوت مارلين.

"حسنًا آتيه"

نهضتُ سريعًا أُهندم خُصلاتي ثم فتحتُ الغرفةَ، إنها نفس المرأة من الأمسِ.

بادلتها ابتسامتها: "صباح الخير"

"أعتذر إن كنتُ أزعجتكِ، لكن الفطور جاهز ومارلين تنتظرُ بالأسفل"

"لا بأس، سأغسل وجهي وأنزل"

أجبت بتفهم، تلك أول مرة أنعم بكل هذا النوم.

ذهبتُ للداخل نحو المرحاض وهي دخلت خلفي لتوضيب الفراش، حاولتُ منعها لكنها أصرت بالفعل.

لم أعتاد مُعاملةَ الأميرات تلك.

بدلتُ ملابسي لرداءٍ وردي لونه مُريح للعين، ضيقٌ من الخصرِ ويتسعُ من الأسفلِ بنقوشٍ بسيطةٍ، لَملمتُ خُصلاتي أمام بكعكةٍ فوضاويةٍ تمنع شعري من إزعاجي، شعري طويلٌ يُعيقني أحيانًا لكنني أحبه هكذا.

اُتيحت لي الفرصة التمعن في وجه المرأة، تبدو قوية الشخصية، هادئة، ممن تراهم فتظنُ أنهم يحملون داخلهم أسرارًا شتى.


"صباح الخير" نبستُ أجذب انتباه مارلين، كانت تنظرُ في الطبق بشرود اختفى حينما لمحتني، وعادت ابتسامتها تتألق من جديد.

"صباح الخير لكِ أيضًا"

جلستُ أمامها على المائدة، فأقبلت فتاةٌ أخرى تضع لي صحنًا بعدما تركت ما في يديها.

كانت تُلملمُ زُجاجًا مُتناثرُ في الأرض!

أيمكن أن يكون ذلك صوت أمس؟

الغريب في الأمرِ أن نوم مارلين خفيفٌ لكنها لم تستيقظ حينها.

"أتمنى أن تكوني تأقلمتِ مع الغرفة"

"آه قليلًا، مع الوقت سأعتاد بالفعل، لكنني لا أنوي البقاء كثيرًا فقط لحينما أُقدم في جامعتي"

حاولتُ صُنع ابتسامة مُجاملة على شفتي، الأمر كله أنني أستغربُ الوضع قليلًا.

عبست بوجهها دون أن تُعلِّق بحرفٍ.. لكنها فتحت موضوعًا آخر:

"كم عُمركِ؟ لا أعطيكِ عُمرًا كبيرًا لكني ظننتُ أنكِ في مرحلة الجامعة بالفعل"

"واحد وعشرون" أردفتُ بتردد، فلا طاقة لي لأخوض ذات الحديث المُتكرر حينما يعرف أحدٌ عمري.. نفس الأسئلة؛ لِمَ تأخرتِ كثيرًا؟ ألم تلتحقي بالفعل وأنتِ في هذا العُمر؟

وكأنهم غافلون عن مُجتمعنا وما يحمله من عنصرية! حتى وإن لم يكن هو سببي فلماذا لا يُصبح حُجتي.

لكن ولسببٍ ما هي لم تسأل، وكأنها شعرت برغبتي في ذلك أو ربما تفهَمت.

"ماذا عنكِ؟" لم أستطع كبح فضولي نحوها.

"أنا في الرابعة والثلاثون"

"تمزحين؟"

هي ضحكت بخفةٍ على تعابير وجهي المندهشة بالتأكيد، تبدو أصغر من ذلك بكثير!

"أبدو أصغر قليلًا، أنا ممن يهتمون بالعناية الشديدة، سأظهر لكِ الآن امرأة مُتفرغة يأكلها الملل لكن تلك أنا لا حيلة لذلك"

لكنها لا تبدو امرأةً يأكلها الملل.

"هذا رائع، في النهاية نحن من نبقى لأنفسنا"

هزت رأسها دلالةً على موافقتها لحديثي.

"حدثيني عنكِ بينما تأكلي، لا تدعي الحديث يُنسينا الطعام"

أومأتُ أقتطفُ بضع اللقم لفمي، لا أمتلكُ شهية لكن يجب عليَّ الصمود.

"بل حدثيني أنتِ، لا أُخفي عنكِ سرًا أملك فضولًا نحو رغبتكِ في تأجير غرفة"

"أتفهمُ ذلك، ربما حتى تمتلكين مخاوف من رغبتي وراء ذلك لكن الأمر أنني لا أحب الوحدة، ولم أجد طريقةً أخرى"

بدت لي جُمل حزينة أو ربما نبرة صوتها ونظرة عينيها هيأت لي هذا.

ألا تمتلكُ أحد! زوج؟ أطفال؟ أقارب حتى؟

لِمَ قد يبتاعُ أحدًا منزلًا كهذا إن كان وحيدًا؟

لكنها أسئلةٌ لا يجب أن تُسأل.. ليبقى هذا الرد ارضاءً لفضولي فقط، لِمَ قد أهتمُ لأكثر من ذلك؟

"أيُّ قسمٍ ستدرُسين إذًا؟"

ربما لمعت عيناي الآن من الحماس، وربما اتساعُ بسمتها ذلك ردًا على ابتسامتي التي زينت وجهي.

        content: `أجلس أمام المكتبِ وبحوزتي ورقة بيضاء فارغة، أُحاولُ أن أعصرَ عقلي لأجد إجابة مُناسبة، إجابة تفتح المجال لرسالة أخرى.

شطرنج؟

حاولتُ المقاومة ونفض ذراعي لكن بائت محاولتي بالفشل.

أما ذلك الشاب فكان يقاومهم ببراعةٍ، لم يكن يتفادى تلك المرة فقط.

أغمضتُ عيني لكي لا أرى، أكره العنف بكلِّ أشكاله.

ثم خطرت لعقلي فكرة، فنظرتُ حولي أبحث عن جذعٍ أو صخرةٍ حتى، ومن حُسنِ حظي أخيرًا كانت هُناك صخرة صغيرة بالقربِ من ذلك الرجل الذي يُتابع باستمتاع.

فأسرعتُ أضع مرفقي سريعًا في معدته، فانحنى يُمسك بطنه بألم.

لقد علمني سِراج تلك الحركة.

أسرعتُ أذهب نحو الصخرة، لكن قبل أن تقبض يدي عليها، أمسك ذلك الرجل يدي يضغط عليها..

شعرتُ بأنه سيخلع لي أصابعي، حاولتُ دفعه لقدمي لكنها تؤلمني بسبب ذلك الجُرح!

"اترُكها!"
نطقَ ذلك الشاب بتلك الجملة.

فنظرتُ حولي لأجد الرجلين طرحي الأرض، رائع!

"احتَرِس!"
نبستُ أُخذره من الرجل الذي كان يُمسكني، كان ينوي ضربه على رأسه، لكنه تفادى ذلك.

قوته البدنية جيدة للغاية.

"اتركيني! أنت تؤلمني"

لكنه لم يتزحزح.. بل كان يُحاول سحبي وراءه بينما ذلك الشاب مُنغمس في تعنيف الرجل.

في ماذا أوقعتُ نفسي حقًّا!

حاول أن يسرع خُطاه حينما لاحظ مجيء الشاب خلفنا، ولإنني كُنتُ أُعرقلُ خُطاه بالفعل وأُثقلها، استطاع أن يُمسكه ويُحررني أخيرًا!

كانوا يتعاركان أمامي وأنا أُحاول الضغط على قدمي، كان الألم يزداد.

لكن نظرتُ بخوفٍ لذلك الشاب حينما استمعنا لصوتِ أقدام، ومن ابتسامة ذلك الرجل فأظن أنهم أعوانه!

أسرع هو تجاهي يُمسك طرف يدي.. وكأنني قطةٌ جرباء بالفعل!

"تستطعين الجري؟"
سألني بصوتٍ يختبئُ خلف ذلك القناع الوشاح الذي يخفي وجهه، وعيناه مُغطاه بالكامل بسبب خُصلاته.

كيف يرى!

نفيتُ برأسي سريعًا، فالجرحُ في قدمي لن يُساعدني على المشي بثباتٍ حتى.

لكنه أسرع يسحبني خلفه، وكأنه ألقى بإجابتي في عرضِ الحائط.

سمعتُ صوت طلقة سلاح، إنهم يُحاولون التصويب علينا!

ليتني أحلم!

"ماذا يحدث؟"
تساءلتُ بأنفاسٍ مسلوبةٍ من الجري وألم قدمي.

من هؤلاء، ومن هذا، وفي أي فيلم أنا؟

لا أستطيع الجري جيدًا بسبب الطُرق المظلمة، لكن يبدو عليه وكأنه يحفظ الطُرق والخطوات جيدًا.

ولقد تجاهلني تمامًا، وحينما اختفت أصوات الطلق والأقدام خلفنا ترك يدي سريعًا.

رفعتُ حاجبي بنفاذِ صبرٍ.

وبدأ يُبدل خطواته لسيرٍ عاديّ ففعلتُ المثل.

حتى وصلنا لشارعٍ عموميٍّ، بالطبع لا يوجد أي شيء ليقلني إلى القصر.

ليتني لم آتِ، ليس وكأنني توصلتُ لشيء.

اِلتفتُ أنظر لذلك الشاب.

"مَن أنت؟"

"لم تتعرفي عليَّ بعد؟"

انكمش حاجبي باستفهام، لكنه لم يوضح.

"راهنتُ على مجيئكِ إلي بقدميكِ"

قبل أن أُجيبه وجدتُ سيارةً تأتي نحونا بسرعةٍ، شعرتُ بخوفٍ جمدني مكاني خاصةً حينما وقفت أمامنا تحديدًا.

وذلك الشاب أسرع يصعد في ذلك المقعد المجاور للسائق.

إنه تبعه؟

"إيلاف، ماذا تنتظري اصعدي أنتِ أيضًا!"

ذلك صوت كولِن!

انحنيتُ لمستوى النوافذ أنظرُ لوجه السائق لأجده هو بالفعل!

تدفقت العديد من علامات الاستفهام حولي.

وكدتُ أسأل أيًّا منهما لولا سماعي لصوتِ أقدامٍ تقتربُ من خلفي فأسرعتُ أصعد دون تفكير.

وزعتُ نظراتي عليهم أحاولُ ربطُ الأحداثَ ببعضها البعض.

لكني تائهة.

"كولن ماذا تفعلُ هنا؟"

رفع عينيه في المرأةِ ينظرُ إليّ وهو ينبس:
"بل ماذا تفعلين أنتِ هُنا؟ كان من المُمكن أن تتأذي!"

ثم نظر جانبه لذلك الشاب فرفعتُ عيني أنظر له كذلك، كان موجهًا وجهه للنافذة وبدا وكأنه غارق في أفكاره لا يُبالي لما حوله.

وفجأة اشتدَّ عليّ ألم قدميّ فانحنيتُ أرفعُ الفُستان قليلًا لأرى ذلك الجُرح.. لم تكن الرؤية شديدة الوضوح بسبب العتمة لكني شعرتُ بسائلٍ خفيفٍ يمرُ من ذلك الجرح، ليس عميقًا لكنه كبير.

تأوهتُ بألمٍ حين مررتُ بيدي عليه، فنظر ذلك الشاب خلفه حتى تلاقت عينينا.

"هل أنتِ بخير؟"
تساءل كولن.

"هُناك جُرح في قدمي، سأُضمده حينما نَصل ليس شيئًا عميقًا"

ثم اِلتفتُ أُخاطب ذلك الرجل: "أنتَ أيضًا يجب عليكَ تطهير جروحكَ، أظنُّ أنَّ وجهكَ مُمتلئ بكدماتٍ عديدة"

لم يُجيبني فاكملتُ: "انزع ذلك السِتار لأرى جروحك"

لن أنكر رغبتي في مُعالجته بالفعل، لكن رغبتي في رؤية وجهه كانت أشدُّ اِلحاحًا داخلي.

لم يلتفت لينظر إلي، لكنه نَبس بنبرةٍ مُبهمةٍ:
"القِناعُ هو الجُرحُ الوَحيدُ الذي يُسمَحُ لَكِ برُؤيَتِه"

القناع جُرح؟ أيُّ معنى قد تحمله تلك الكلمات؟

"يُمكنكِ النزول"
نبس كولن بعدما أوقف العربة، إذ بنا وصلنا بالفعل أمام منزل مارلين.

كانوا هم أول من ترجلوا، بسبب ألم قدمي حركتي بطيئة.

"سأُساندكِ للداخل"
قال كولن وهو يقتربُ مني ليُمسك ذراعي.

واتجه ذلك المُقنع لمقعد السائق دون الدلوف، بل أسند ثقل جسده يُطالعنا.

توقفتُ فجأة عن السيرِ فأسرع كولن ينظرُ إليَّ باستفهامٍ.

لن أخطو خطوةً دون أن أفهم ما يجري حولي!

"أنت من تُرسل إلي تلك الرسائل؟"

سألته وأنا أخطو نحوه خطواتٍ مُتعسرةٍ من الألم.

شعرتُ بحاجبيه يرتفعان بسبب حركةِ شعره، ربما تفاجأ من اندفاع كلماتي.. تفاجأتُ مني أيضًا.

وحينما وقفتُ أمامه تفصلنا خطوةٍ واحدةٍ، أصابني شعورٌ بالبردِ في جسدي، ربما توتر، خوف، فضول.

بل وازداد هذا الشعور حينما تبادلنا النظرات بصمت، اضاءة الشارع كانت كفيلة لأن أرى كيف ينظرُ إليّ، وكأنه ينظرُ إلى أعماقِ روحي، عيناه حالكةٌ وكأنها لم تُبصر نورًا أبدًا.

أما هو فببطءٍ شَديد أزاحَ جَسَدَهُ عَنِ السيارة، وخَطا نَحوي خُطْوَةً واحِدَةً جَعَلَتْ الظِّلَّ يَغْمُرُني بالكامل، فتفقدت رائحته لأنفي، لَمْ تَكُنْ رائِحَةً مَأْلُوفَة، بَلْ خَلِيطًا ثَقِيلًا مِنَ الجِلْدِ الأسْوَدِ المَمْزُوجِ بِدُخانِ البَخُورِ المَحْرُوقِ وأَثَرٍ جافٍّ مِنَ التَّبْغِ العَتِيق. رائِحَةٌ دافِئَةٌ ومُرْعِبَةٌ فِي آن، تَعْلَقُ بالأَنْفاسِ وتَفْرِضُ هَيْبَتَها دُونَ اسْتِئْذان أمالَ رَأْسَهُ قَلِيلًا، ونَظَرَ إلَي مِنْ خَلْفِ ثُقْبَيْ قِناعِهِ الجِلْدِيِّ بِنَظْرَةٍ جَافَّةٍ لا تفسير لها.

"إذا أَلْقَى الصَّيّادُ شِباكَهُ فِي الظَّلامِ واصْطادَ غَزالَةً.. أَتَسْأَلُهُ الغَزالةُ بَعْدَ الأسْرِ: أَنْتَ مَنْ أَلْقَى الشَّبَكَة؟ أَمْ تَتَساءَلُ بَلَاهَةً كَيْفَ وَقَعَتْ؟"

سكنت أنفاسي وتجمدت الكلمات على شفتيّ.. إنه يتلاعبُ بي.

من هو؟

لكن أشعر برغبةٍ في مُجارته، في سحبِ الكلمات منه: "أهكذا يصطادُ الفُرسانُ، أم أنَّ الخوفَ هو ما جعلكَ تختبِئُ خلفَ الحِبر؟"

لمحتُ بريقًا خفيضًا مرَّ على عينيه، لكنه لم يُجيبني.

صعدَ يهمُ للرحيل، أردتُ منعه لكن قدمي لم تُسعفني للضغطِ عليها حتى.

فبقيتُ أنظرُ في أثره بروحٍ تائهةٍ.

تحاملتُ على نفسي للدلوفِ إلى البيت، أردتُ استجواب كولن في طريقي لكن يبدو أنه ذهب منذ مُدة، لا أعلم أين يذهب!

طرقتُ الباب وأنا أشعر بالتردد، بالتأكيد الجميع نُيامًا.. لكن لم تمرُّ خمسُ دقائق وإذ بمارلين تُقابلني.

اتسعت ابتسامتها تسحبني للداخلِ: "أين كنتِ؟ كدتُ أجن من الخوفِ!"
صوتها كان يملأه القلق بالفعل.

نظرت تتفحصني حتى خطت عينيها على جُرحي.

"قدميكِ!"
صاحت وقلقها بدأ يزدادُ في صوتها.

لا تعلمُ أن جروح روحي أشدُّ عُمقًا من ذلك الجرح.

"جرحني جذع شجرة"

أجلستني ثم ذهبت من أمامي، بالتأكيد تُحضرُ الأدوات الطبية.

بعد دقائق وجدتُها تهمُ إلي بحقيبة الاسعافاتِ الأولية كما خمنت.

"لا أفهمُ في تلك الأشياء، لكن يُمكنني مُساعدتكِ"

ابتسمتُ لها بامتنانٍ وأنا أمدُّ يدي لأخذِ الحقيبة.

نظرتُ للجُرحِ بوضوحٍ تلك المرة، لا يحتاجُ خياطةً كما ظننتُ، سحبتُ المُطهر ثم دفعته إليها.

"يُمكننا أن نعتبرَ هذا درسَكِ الأول"

ابتسمت تأخذه من يدي تنتظرُ إشارةً مني.

"ضعي القليل فوق القُطن ثم بلُطفٍ مسدي صعودًا ونزولًا على الجُرح"

يديها لم تؤلمني لكن شعرتُ بوخزٍ طبيعي.

كانت مُنغمسة في ذلك، نظرتُ إليها أُحاول أن أعلم هل هي جيدة أم سيئة، في أي دورٍ تقف مع ذلك المجهول، ربما لها يد وربما لا.

لكن وجود كولن بين كلاهما يجعلني أشك بالفعل!

"الآن ضعي تلك الربطة واحكُميها جيدًا ثم الصقيها لكي لا تتفكك"

"سأحتاج لفعل هذا كل يوم مرةً، حينها تُشاهديني أيضًا ليكتمل درسنا الأول"

"اتفقنا إذًا!"
بدت سعيدة جدًا.

"شُكرًا لكِ"

أومأت برأسها بمعنى لا داعي ثم لملمت الأدوات مكانها لتُطالعني.

"ما الذي حدث؟ يُمكنكِ مُشاركتي إن أردتِ"

لا أعلم، أرغبُ بمُشاركة هذا مع أحد لكن أشعر بأنه من الأفضل أن يبقى سري فقط.

"والدي يرغبُ بزواجي رغم رفضي"

ربما يُمكنني مشاركة هذا.

لم تنطق شيئًا، وكأنها لا تعلم أي الكلمات أنسب في تلك اللحظة، لكنها عانقتني تُمسدُ على ظهري.

"لا يستطيع إجباركِ، سأُساندك"

ثم أكملت تفصلُ العناق: "حينما كنتُ في سنكِ فعل والدي معي المثل، كان يودُّ زواجي لرفعِ مستوى العائلة، لم يكن قاسيًا لكن لم يكن من هذا النوع الذي تستطعين الحديث معه، ولا مجال للتعبير عن رأيكِ، دائمًا ما يكون رجل المنزل قراره صحيح"

نبرتها ثقيلة، وعينيها غامت في اللا شيء وهي تسترجعُ ذكرايتُها.

ثم أكملت بنبرةٍ بدأت تهتزُ بحزنٍ: "وفي يومٍ قرر والدي أنه يوم زفافي، لم يكن يُدرك أن أحلامي كانت تنحصرُ في مكانٍ آخر مع وجوهٍ مختلفة، وأنني مُجرد فتاة ترغبُ في اكتشافِ العالم، حينها ظننتُ أنَّ عالمي ينهار، أحلامي تتلاشى بسبب فرق السن بيننا وأنه في النهاية رجل، فكرتُ في الهرب، التفاوض، أو حتى الانتحار، لكن ما لم أحسبه أنها ستُضحي من أجلي، سترمي نفسها في النيران لأحيا أنا بنفسٍ مُطمئنة، بنيتُ أحلامي على حسابِ أشخاصٍ آخرين، وكانت تذكرة خروجي من الجحيم هي ذات تذكرة دخولها إليه"

عن من تتحدث؟

لكن ما استقطب انتباهي هو بُكاؤها، كانت تشكو بنبرةٍ مُختنقة، ظللتُ أنظر لها بتيهٍ، لا أعلم مما تُعاني، وما مدى سوءِ تلك الذكرى لتُخرج منها أوجاعًا كتلك!

لكن لم أتردد في مُعانقتها، أُحاول امتصاص حُزنها.

قليل من الوقتِ وبدأت تستجمعُ نفسها، كانت عينيها تعتذرُ لي عمَّ حدث ربما.

إنها تعيشُ أذمة عذاب الضمير، هنالك شيئًا يُثقلُ صدرها.

أنا أكثرُ من يعلمُ عذاب الضمير، كيف ينهشُ في الروحِ، كيف يسلبُ لذة الحياة منكَ، وكأننا في كلَّ موقفٍ نتساءل ماذا لو كانوا هم، في كلِّ بسمةٍ نتذكرُ أننا نعيشها على حسابِ فمٍ آخر لم يبتسم، روحٍ أُخرى لم تُدرك معنى تلك السعادة، وكأننا نسلُبهم ما منحونا، أو ربما تلك ضريبة الحياة.

لكن أي نوع من عذاب المضير تُختبر هي؟

لم أرغبُ في فتح جروحها بيدي، فجلسنا صامتين نُحدقُ في نيران المدفأة.

"أودُّ مُشاركتك خبرًا سعيدًا"

انتبهتُ لها بكلِّ حواسي حينما نطقت، فالسعادة هي الشيء الذي ينقصني.. كما وددتُ تخفيف وطأة الحرج من عليها لما حدث قبل دقائق.

"عائلتي، وصلني اليوم خبر مجيئهم خلال الأيام القادمة"
شعرتُ بالحماسِ في نبرتها.

رغم عدم فهمي لكلِّ ما يُحيط بها، لكنني سُررتُ من أجلها.

رغم أن ذلك يدفعني للبحثِ عن مأوى سريعًا خلال تلك الأيام، لا يصحُ جلوسي كفردٍ منبوذٍ وسط عائلة.

"إنه خبرٌ رائع بالفعل"
نبستُ أشاركها حماسها.

"سيحبونكِ كثيرًا، أشعر بالحماس للقائكم"

لم أرغبُ بتدنيس ساعدتها بقرار رحيلي حين وصولهم، فاضطررتُ لمُجارتها مؤقتًا.


يبدو أنني استيقظتُ أولًا اليوم، واجهتُ صعوبةً في النزول بقدمي لكن الألم أقل قليلًا بعدما أخذتُ مُسكنًا ما.

كان الوقتُ مُبكرًا فرغبتُ بشمِ بعض الهواء قبل موعد الفطور.

لم تكن لي وجهةً مُحددة لكن وجدتُ قدمي تُرشدني للمكتبة، ربما سأنسى نفسي بين سطور كتابٍ ما.

بحثتُ في قسمِ الأدب عن شيءٍ يعكسُ مشاعري لكن انتهى بي المطافُ آخذةً كتاب عن علمِ النفس.

ظللتُ أتجرعُ الكلمات رويدًا حتى قابلتني تلك الصفحة، كاتبها يتحدثُ عن النقيض بين الصمتِ والإفصاح، وما أوقفني هو تلك المُلاحظة الصغيرة بخطِ اليد في هوامشِ الصفحة:
"الألم يصبح وصمةً حين تُعرِّيه، والصمت كسوةٌ للروحِ من هشاشتها، فمن مِنّا قد يرغب في صفعةِ بوحٍ تُحيي ما مات فيه؟ ومَن قد يرمي نفسه على قارعةِ الألسن؟"

صاحبُها يملكُ تفكيرًا جذابًا رغم كآبة نظرته للبوحِ.

لم أستطع الإكمال بسبب الوقت، ما زلتُ أرغب في المرورِ لسراج قبل العودة.

ذهبتُ أتفقدُ المقهى لكن لم أجده، خمنتُ ذهابه اليوم إلى الجامعة، فهو يدرسُ بقسمِ الفنون، يعملُ على التصميم رغم افتقاره للذوق الفني.

غامت عيني بحزنٍ حينما تذكرت أنه من المفترض أن يكونَ خريجًا منذُ عامين لولاي.

وكأنني خُلقت لأُلحق الأذى لمن حولي فقط.

قررتُ العودة والمجيء في وقتٍ آخر لكن تصلب جسدي حينما رأيتُ وجهًا مألوفًا أمامي.

وددتُ الذهاب سريعًا في طريقٍ مُخالفٍ لكنها نبست باسمي توقفني.

"ارتكبتِ ذنبًا جديدًا فتهربين لتخفيه؟"

ما زالت كما هي، حادة الحديث والأسلوب، أو ربما لم تكن يومًا كذلك وأنا من دفعتُها لتصبح معي هكذا.

لم يخرُج صوتي مني للإجابة، بل وبدا كل شيء يُعاد أمامي، استطعتُ الصمود واقفةً بصعوبةٍ.

وكأن الهواء الذي خرجتُ لشمه تجمعَ في حلقي ليخنُقني.

"ما زلتِ تلتقيه هنا؟ ألا تشعرين بمدى أنانيتك؟ اتركيه يمضي قدمًا، اتركيه يتنفسُ هواءً نقيًّا لا مجال لأنفاسكِ فيه!"

حينها لم أتمالكُ نفسي، وحين اقتربت هي مني وجدتُ نفسي أجري بعيدًا، أجري مُتناسيةً ألم قدمي، أجري هاربةً كما أفعلُ دائمًا.

أنا أضعفُ من المواجهة، وأضعفُ من تركه، سِراج هو الوجه الوحيد المألوف، الأمان نسبةً إلي.

لكنني كنت أسلبه أمانه دون أن أُدرك.


عدتُ بروحٍ مُنهكةٍ مُجددًا، لكن حاولتُ اخفاء هالتي الحزينة، أول وجه قابلني كانت السيدة مارغريت.

وقفتُ بجانبها نتشاركُ الكلمات بينما تعدُّ الفطور.

"أخبرتني مارلين أن عائلتها ستأتي قريبًا"

أومأت برأسها بهدوء وعينيها تُتابع حركة يديها مع الفطائر.

"كم فردًا هم؟"
تساءلتُ بفضولٍ.

الفضول هو سبيلي الوحيد لأحيا، بدونه لكنتُ هُلكت من عيشِ الهموم.

"ربما تسعة وربما عشرة"

هاه؟

"لا تعلمين العدد الصحيح؟"

اِلتفتت تلك المرة تُناظرني: "بل لا أعلم كم فرد يُحتسب من العائلة تلك المرة"

هل أصبحت لغة الجميع الغموض أم أنني أصبحتُ بطيئة الفهمِ؟

"لم أفهم؟"

لكنها لم تُجيب بل أشارت بيديها نحو رفٍ يقبعُ خلفي: "أعطِني الملح"

ناولتُها ما طلبت في انتظارِ إجابةً تُرضي فضولي لكنها لم تنطق حرفًا.

وقبل أن تُتاح الفرصة مُجددًا دلفت مارلين بوجهٍ مُشرقٍ وهالة جذابة كعادتها، إنها تُجيد تصنعُ السعادة جيدًا.

"ظننتُكِ نائمة فعرجتُ على غُرفتكِ لإيقاظكِ، لكنكِ هُنا بالفعل"

"لستُ كثيرة النوم"

ثم جلسنا على المائدة نتناول طعامنا، كنتُ أُفكر في ردةِ فعل والدي، ماذا قد يفعل وهل يبحث عني أم أنه لم يهتم كعادته.

"كُلي جيدًا وتوقفي عن الشرود"
نبست تُمسد على يدي لتلفت انتباهي.

"شبعت بالفعل"

جعدت جبينها بعدم رضا لكنها لم تُعلق، أو ربما لم أترك لها الفُرصة أخذتُ صحني للمطبخِ بالفعل.

وقبل الصعود لغرفتي رنَّ جرس الباب، ظللتُ واقفةً بفضولٍ.

نهضت مارلين لتفتح هي مانعةً روز من ذلك، كان كُولِن.

"صباح الخير سيدة مارلين، جاءكِ بريدٌ"

مدَّ يديه بظرفٍ فأخذته وهي تشكره.

اقتربتُ منهم راغبةً في مُحادثة كولن لكنه فورما لمحني ذهب سريعًا.. إنه يتهرب مني!

"إنه دعوةٌ لحفلةِ العام"

بدت حزينة، ظننتُ أنها ممن يحبون تلك الأشياء.

"لن أذهب بمُفردي."

"لا تعبسي فورًا بوجهكِ، يُمكنكم الذهاب سويًا"
كانت تلك السيدة مارغريت.. لقد أشارت إليّ.

لكن بالطبع لا!

وهي لمعت عينيها فجأة وكأن الفكرة نالت استحسانها.

"إيلاف؟"
نظرت إلي تسألني بعينيها، لم أستطع رفض طلبها.

"لا مُشكلة، لكن تلك حفلتي الأولى في هذا المُجتمع.. ستحتاجين مجهودًا لإرشادي"

ابتسمت تنفي برأسها: "لا بأس، سنستمتعُ سويًا أنا واثقة"

"سأصعدُ لأُغير على جُرحي ثم أبحث عن رداءٍ مُلائم إذًا"


كادت يدي على وشكِ الامساك بالمقبض، لكنني تجمدتُ مكاني حينما استمعتُ صوتًا يأتي من الداخل، من غُرفتي!

بشجاعةٍ اكتسبتُها مؤخرًا فتحتُ الباب ببطءٍ أدفعه للدخول، لا يوجد شيء!

وقبل أن ألتفت لإغلاقه وجدتُ يدًا تُقبضُ على فمي تُكبله، حاولتُ الصراخ لكن صوتي كان مكتومًا بالفعل!

نظرتُ بطرفِ عيني لأراه.. إنه هو!

المجهول.

هدأتُ قليلًا، ربما لأنه شخصٌ مألوفٌ لكن في النهاية إنه خطيرٌ.

حاولتُ دفعه لكن جسده كان بعيدًا، لقد كان حريصًا على ذلك البُعد، يقفُ بعيدًا ويديه الإثنان واحدة على فمي والأخرى خلف رأسي.

لم تكن قبضته قوية لكنها مُحكمة، نظر في عيني لثوانٍ ثم فجأة تركني ليُغلقَ الباب.

شعرتُ بالقليل من التوتر والخوف فتراجعتُ أُمرر يدي على فكي، قبضة يديه خانقة!

صوتٌ داخلي أخبرني أن أصرخ، لكن صوتًا آخر أخبرني أن أرى ماذا يريد، في النهاية الشخص الوحيد المُكلف بحمايتنا هو كولن ذاته الشخص الذي على صلةٍ بهذا الرجل!

"ماذا تفعل هنا؟"
حاولتُ اخفاض نبرتي الصائحة.

وهو كان يُدحرجُ عينيه على زوايا الغُرفة، وكأنه يبحثُ عن شيءٍ ما.

"سنلعبُ لعبةً"

لعبة؟

نظرتُ باستفهامٍ نحوه، وهو كان يُطالعني كذلك.

لم أجد ما يُمكنني قوله، إنه يُفاجئني الآن.. وهو بدا واثقًا ومرتاحًا، يديه في جيبيه ووقفته شامخة، وما زال لا يرفعُ عينيه عني.

"الفضول يُراودكِ وينهشُ في دواخلك، سأنزعه لكِ"

كلما ينطقُ شيئًا يضيقُ صدري من التوترِ.

"سأُعطيكِ لُغزًا وتُعطيني لُغزًا، إن أجبتُكِ وسأفعل أضعتِ فُرصتكِ، وإن جاوبتيني أنتِ لديكِ الفُرصة لتسأليني ما تشائي وسأُجيبكِ، وإن أجبتِ خطأً ستكون هُناك عواقب لهذا"

لن أقفُ وأستمع لأكثر من هذا، كنتُ على وشك تخطيه سريعًا والخروج من الغُرفةِ لكن كان أسرع مني وهو يقبضُ على الباب بيديه.. ثم لف المُفتاح ووضعه في جيبه!

حركةٌ جعلت الخوف يتسللُ إليَّ

"إن صرختُ الآن سيُكشفُ وجودكَ هُنا"

لكنه لم يتأثر، لم أكن أهدده فقط، إن شعرتُ بالخطر سأصرُخ بالفعل، لكن لا أودُّ ادخال مارلين في أمورٍ لا تعنيها أو عواقب أخرى، اكتفيتُ من إيذاء من حولي.

"لِمَ سأُساير لعبتك هذه؟"

خرجت منه بسمةٌ ساخرةٌ أو واثقة!

وكأنه كان ينتظر هذا السؤال.

تقدم يجلسُ على مقعدِ المكتب.. إنه يتعمد حرق أعصابي.

"أخبرتُكِ هناك عواقب"

"افعل ما تشاء، لا شيء يُجبرني على الحديث معكَ! أنا لم أرَ وجهكَ إلى الآن حتى"

"استغلي فُرصتكِ إذًا"

يُريدني مُسايرته في لعبته لأتمكن من السؤال!

لكنه أكمل بنبرةٍ ذات مغزى: "وتعلمي ألا تأمني للهدوء الذي يسبق العاصفة، أو لليد التي تمسح على رأسكِ بلمسةٍ دافئة... الخناجر لا تُستلّ في العلن، بل تُرعى في الخفاء حتى يكتمل نصاب السُمّ"

عن من يتحدث؟

أردتُ السؤال لأصل للمغزى من هذا الحديث، لكن شعرتُ بأنه لن يُجيب لذلك أهتممتُ للأهم:

"أخبرني العواقبَ إذًا"

"خُسارتكِ أمامها خُسارتكِ"

ما زال مُبهم!

"ماذا تقصد؟"
تساءلتُ مُتأهبةً للقادم، فلا أظنه شيئًا مُبشِرًا.

"تخسرين أمامي، فتخسرين شخصٌ تُحبيه، مثلًا مارلين صاحبة المنزل، أليس مارلين صحيحًا؟"

نظرتُ إليه بعدمِ تصديق، لا أعلم هل يتحدث بجدية أم إنه يتلاعبُ بي.

بدأتُ أختنق وأرغب في الخروج من هُنا.

وهو كان يُصدرُ صوتًا مُزعجًا بخبطةِ يديه على المكتب.

"اعطني اللغز"

كان أسرع قرارًا متهورًا في حياتي، لكنني أردتُ مُسايرته والخروج من هُنا، بالتأكيد إنه يُهددني فقط!

"اعطيني لُغزكِ أولًا"

لا أملك شيئًا، خاصةً أنني أظنه شديد الذكاء، أي لغزٍ هذا الذي يستلاعبُ بعقلهِ!

عصرتُ عقلي لكن لا شيء يخطرُ على بالي.

لكن تذكرتُ فجأة لعبة الكلمات المُتقطعة، كان هُناك لُغزًا لم أستطع حله سابقًا.

"ولدَ في أحشاء النار، ويعيشُ مقيدًا في زوايا الظلام.. يبتلعُ أسراركِ دون أن ينطقَ بكلمة، ويحرسُ أثمن ما تملكُ دون أن يَملُك شيئًا، إن أطعمت قطعته الفولاذية الملتوية استجب لكَ وطائعًا يفتحُ أحشاءه، وإن أخطأت السِّنَّ... يكسرُ أملَك ويتركك خلف الجدار إلى الأبد."

كان يُطالعني بهدوء، ثم ابتسمَ حينما انتهيت، عيناه ابتسمت، لكن لم تكن ابتسامةً طبيعيةً، بل وكأنه دائمًا يسخرُ مني!

"لنرَ إلى أي مدى يتسعُ عقلكِ"

ارتفع حاجبي بنفاذِ صبرٍ لكن لم أرغب في مجادلته، ما زلتُ أحتاطُ منه.

"يجري في الأرضِ بلا قدمين، يُغير وجهة مع كل شمس، يبني قصورًا من الأوهامِ في حضوركِ، ويحفرُ لكِ قاعًا في غيابكِ، لا يُلمس باليد لكنه يذبحُ دون قطرةِ دماءٍ واحدة"

قبل أن أُجيب سمعتُ طرق على الباب وصوت مارلين ينتشرُ: "إيلَاف، أودُّ رؤية اختياركِ إن كنتِ انتهيتِ"

تصلب جسدي من التوتر ولم أعلم ماذا سأفعل، وهو كان هادئًا وكأن أعصابه من جليد.

تقدم نحوي ثم انحنى على أُذني لابتعد بحذرٍ، لكنه همس: "موعدنا الساعة الثانية عشر، تأتيني بالحلِ وتأخُذين إجابتكِ، دقيقةٌ زائدة تجعلكِ تواجهين عواقبًا يا طبيبة"

حديثه من جهة وطرق مارلين من جهة! سيُغمى عليّ حتمًا.

"إيلاف هل أنتِ بخير؟ سأدخل الآن"

أسرعتُ أتدارك الموقفَ لأفتح الباب سريعًا بعدما رفع المُفتاح أمام عيني.

وهي نظرت إلي بتوجسٍ، ربما لأنني أغلقتْ بالمُفتاح أو ربما التوتر يظهر على ملامحي.

أغلقتْ الباب خلفي لأخرج أمامها.

"كنتُ في المرحاض"

لم يبدو عليها الاقتناع التام وهي تنقلُ عينيها بيني وبين الباب من خلفي، لكنها تجاهلت.

"هل اخترتِ شيئًا لارتدائه؟"

نفيتُ برأسي فابتسمت في وجهي وهي تُمسك يدي.

"لنذهب إلى غُرفتي، هُناك فُستان لا أستطيع تخيل فيه أحدًا سواكِ"

مشيتُ معها ونظري مُعلَّق على بابِ الغرفة، كيف سيخرُج من هُناك!


عرضت عليَّ فُستانًا كستنائيًا مُبهرًا، كان حريرًا ذو أكمامٍ طويلةٍ، وطوله يصلُ إلى كعبي القدم بنفشةٍ بسيطةٍ.

"إنه رائعٌ بالفعل، لكن يُمكنني ارتداءَ واحدًا من عندي"

عبست بوجهها: "نحن أصدقاء إيلاف، لا بأس بتشاركُ الأشياء، أم أنه لا يُعجبكِ فتتهربين مني؟"

نفيتُ سريعًا فقد كان جذابًا جدًّا للحقِّ ومُختلفًا عن التطريزات الأُخرى.

"لقد رأيته صُدفةً في عرضٍ لمجلةِ الموضة، كنتُ أُعلِنُ عنها ووجدته، حينها شعرتُ بأنه يجب عليه أن يُضع في خازنتي، لكن لم أرتديه يومًا"

تُعلِن عنها؟

"أنتِ تعملين في مجالِ الصحافةِ؟"

اتسعتْ ابتسامتها تُومئُ لي، لم أتوقع عملها ذاك أبدًا.

"ماذا سترتدين أنتِ إذًا؟"

شعرتُ بحامسها تجاه تلك الأشياء فاردتُ مُشاركتها الحماسِ والاهتمامات.. وهي بالفعل بدأت تعرضُ أمامي أكثر من اقتراح وهي سعيدة.


"حسنًا، سأعود في السابعة مساءً لنستعد لا تقلقي"
نبستُ أُخبرها بعدما أخبرتني للمرة الثانية على التوالي بألا أتأخر.

أردتُ الذهاب لتفقدُ سِراج مُجددًا، بالتأكيد عاد.

عرجتُ في طريقي على الصائغ، لقد تركتُ له سِلسالًا ذهبيًا تركته والدتي لي، حين سقطَ مني غفلةً وانكسرَ غطاءه شعرتُ بأن ضلعًا مني قد انكسرَ، لكن سِراج اقترح عليّ إصلاحه هُنا.

واليوم استلمته، ظللتُ طول الطريق ألتمسه بأصابعي، أُغلقه عليه بكفيّ.. اشتقتُ إليه وكأنه جزءًا مني.. واشتقتُ أكثر لصورتنا داخله، الصورة الوحيدة التي أملكها لها.

دلفتُ لتُداعبني رائحةُ البُنِ والمخبوزات، مسحتُ بعيني المكان جيدًا حتى وجدته يقفُ عند طاولةٍ ما، اقتربتُ سريعًا لتلتقط أُذني أحاديثهم.

"وأنتَ ما اسمُكَ؟"
نبست فتاة من الجالسين بهذا السؤال، بنبرةٍ مُصطنعةٍ.

فأجابها بابتسامةٍ اتسعتْ في وجهها، وحين يراني لا يفعلُ شيئًا سوى ضربي على مؤخرة رأسي!

لعوب!

"وأنتِ؟ بل دعيني أُخمن، رُبما آستِر لشدةِ جمالك"

ضحكت بخجلٍ.. وأنا لويتُ شفتي بإشمئزازٍ، مُغازلة عجيبة.

لكن ما المُضحك!

تسللتُ من خلفه حين لم يشعرُ بوجودي ثم فزعته، وبعدها سقطتُ في الأرضِ وصوت ضحكاتي يملأ المكان.. لقد صرخ صرخةً مدويِّةً بفزعٍ.

الجميع نظر حوله بتعجبٍ حتى الفتيات رأيتُ في عينهم نظرةَ احتقار، بالطبع فكيف بوسامته وهالته الخطر تلك صرخ صرخةً كهذه.

عيناي أدمعت من كثرِ الضحك!

وهو اِلتفت بغضبٍ يسحبني عند طاولةٍ أخرى، لقد أضعتُ عليه فُرصةً ذهبيةً للأسف.


"كم مرةٍ سأُخبرك بأنني كنتُ أمزح، لم أتوقع صُراخك بهذا الشكل!"

نبستُ بضحكٍ في آخرِ الجُملة بعدما تذكرتُ الموقف مُجددًا.. الآن أُطارده في كلِّ ركنٍ ليتوقف عن هذا العبوس ويُحادثني لكنه مثل الطفل!

نظرَ إلي بحدةٍ حين ضحكتُ مُجددًا فابتلعتُ ضحكتي بصمتٍ.

"حسنًا صمتُ"

"على أي حال ما الذي آتى بكِ؟"

عبستُ أتظاهرُ بالحزنِ: "لم تودُّ رُؤيتي؟"

"أنا غاضبٌ منكِ، ليس لسخافتكِ منذُ قليل، بل لأنكِ ستجعلين شعري يشيبُ من القلق، أمس حادثني والدكِ بعدما تخطت الساعة اثنى عشرة مساءً ليُخبرني أين هربتَ ابنتي.. خمني ماذا؟ لا أعرفُ أن ابنته هربت من الأساس، بل لماذا تهربُ ومِمن! هل تتخيلين مدى القلق الذي عشته إلى الآن، ظللتُ أبحثُ عنكِ طوال الليل والنهار كالمجنون، حتى أنني ذهبتُ لذلك المنزل والحارس أخبرني بأنكِ لم تعودي، فوتُ جامعتي لأظلُّ أبحث مُجددًا دون أن تغفلَ عيني، وفي النهاية يُخبرني أحدٌ بأنكِ أتيتِ صباحًا تسألين عني، وكأنكِ أخيرًا تذكرتِ وجودي!"

كان غاضبًا، لم يتوقف بُرهةً لأخذِ أنفاسه وسط الحديث.

لكنني كرهتُ نفسي مع كلِّ كلمةٍ خرجتْ منه، كرهتُ إلى أي مدى هو يُحبني لأمدَّ قلبَه بكلِّ هذا القلق، وتيقنتُ مُجددًا أنني لا أفعلُ شيئًا له سوى سلبِ الطمأنينةَ من حياته، لكن لم أتوقع أن يفعل والدي شيئًا كهذا! ليتني لم أذهب حتى.

لم أستطع السيطرة على دموعي، ولم أجد تبريرًا قد يُهونَ عليه كلِّ ثانيةٍ عاشها في قلقٍ بسببي.

"أعتذرُ"
ظللتُ أُرددُ تلك الكلمةِ بين دموعي حتى همَّ يُعانقني وهو يُربتُ على ظهري، شعرتُ بسوءٍ أكبر لأنني لم أهن عليه حتى رغم ما سببتُ له.

"حسنًا لا بأس، اعترفي أنكِ تستخدمين دموعكِ لأضعافِ موقفي"

ابتسمتُ بحُزنٍ وأنا أبتعد عنه ماسِحةً وجهي بكفِّ يدي.

"هل يُمكنكِ اخباري بما يحدث بينكم على الأقلِ؟"

إنه يسأل بأدبٍ وكأنه لن يأخذ إجابته غصبًا حتى وإن رفضت.

لكنني أومأتُ أقصُ عليه ما حدث.. مُتلاشية ذلك الجُزء المُتعلِّقُ بالمجهول وضربِ النار، إن أخبرته قد تحدثُ له أزمةً قلبية!


"عديمُ الشرفِ"

كانت أولُ كلمةٍ تخرجُ منه بعدما قصصتُ عليه ما حدث، شعرتُ بحُزنٍ داخلي عمَّ قاله عن والدي لكنني صمتُ، لا أجدُ مُبررًا له أمام نفسي أو أحدٍ آخر.

"كيف لم تُخبريني، كنت سآتي وآخُذكِ رغمًا عنهم، لقد حادثتيني بالفعل يا إيلَاف لتُخبريني عن أُحجيةٍ ما ولم تُخبريني عن ذلك!"

بدأ ينفعلُ مُجددًا، إنه من ذلك النوع الذي يغضبُ سريعًا ثم يهدأ سريعًا، لا وسطَ له.

"لم أرغبُ اقحامكَ في الأمرِ، لقد رأيت بنفسكَ والدي يُحملكَ مسؤولية الأمر دون أن تعلم عنه حتى"

"إن كان يفعلُ في كلا الحالتين، فأُفضل أن أعلم إذًا"

معه حق، لكن لا أُريد أن أُثقل كاهله.

"لا تقلقي، لن يستطيع إجباركِ على شيء وأنا معكِ"

نبس يشدُّ على يدي، فابتسمتُ له بامتنان، يُشعرني دائمًا بأنه أخي الكبير وبأنني مسؤولةٌ منه، كيف سيكون العالم بدونه حقًا!

"لا تقلق أنت، لا أظنه قد يفعل شيء لإرغامي، يعلمُ أن مساومتي على حُلمي تكفي لكسرِ ظهري"

غامت عيني بحزن لم أستطع السيطرة عليه.

وهو لم يكن يعلم كيف يواسيني، ولم أرغبُ بأن أضع حملي على كتفيه.

"يجب عليَّ الذهاب الآن، وداعًا"


أقفُ في غُرفتي وأنا أدورُ حول نفسي، كانت مارلين تستعدُ في غُرفتها وبينما أنتظرُ هنا تذكرتُ ذلك اللغز الذي أعطاني إياه، الآن الساعة السابعة والنصف مساءً، لم يتبقَ الكثير.

شيء يجري في الأرضِ بلا قدمين؟ الماء رُبما؟

لكنه لا يبني قصورًا!

وقبل أن أنغمسَ في التفكيرِ أكثر كانت مارلين تطرقُ الباب بالفعل، أذنتُ لها بالدخول.

كانت ترفعُ شعرها على هيئةِ كعكعةٍ بخُصلاتٍ منثورةٍ على وجهها.. زينت وجهها بألوانٍ زادتها إشراقًا، كانت ترتدي فُستانًا سماءِ اللون، وتُحيطُ بكتفيها معطفًا أبيض من الفروِ، كانت شديدةَ الجمالِ.

"جميلةٌ جدًّا"

احمرت وجنتيها بخجلٍ وهي تُتمتم بعبارةِ الشُكرِ.

"أنتِ عنوان الجمال بحدِّ ذاته، كما توقعتُ بالفعل الفُستان لن يليقُ على أحدٍ سواكِ"

اِلتفتُ أنظرُ لانعكاسي في المرآةِ، لقد كان الفُستان يحتوي جسدي برقةٍ، أعطاني هيئةً رقيقةً، وتركتُ شعري مُنسدِلًا عكسها، ورغم إصرارها لأضع القليل من مساحيقِ التجميل لم أوافق سوى على تكحيلِ عيني لإرضاءها، لكنه أبرَزَ جمالِ لونها العسليّ، غلفتُ كفيّ بقُفازين يُماثلان لون الفُستانِ، شعرتُ بأنهم يُقيدون يدي لكن لا بأس.

"أظنُ أنَّ كولِن أحضر سيارتي بالفعل، لننزل"

أومأت أسيرُ خلفها للأسفل، كولن لن يستطيعُ الهربَ مني الليلة، بالتأكيد وهو من يُأمن دخول وخروج ذلك الرجل! إنه يخون أمانةَ مارلين بالفعل.


لم ترغب مارلين في قيادةِ السيارة، فأُرغم كولن على إيصالنا، ظللتُ طوال الطريق أُحاصره بعيني وهو يتهربُ مني.

حتى وصلنا، ترجلت مارلين ففعلتُ المثل، وهو لم ينتظر بل ذهب سريعًا لموقفِ السيارات حسب ظني.

كان المكان مُكتظًا بالكثيرِ من الرجال والسيدات على بوابةِ الدخول فقط! ماذا عن الداخل؟

سِرنا سويًا نحو الداخل، كان قصرًا كبيرًا لا يختلفُ حجمه كثيرًا عن خاصة مارلين، لكن هذا كانت أركانه تبوح بثراءٍ مُبالغ به، وبهرجةٍ زائدةٍ، لا يرمز للبساطةِ أبدًا، الرجال هُناك تفوح منهم هالة الثراء، والنساء يتنافسن على الأجملِ والأكثر حملًا للمجوهرات!

الموسيقى مُنتشرة وهناك رائحة طعام ومشروبات، حينما دلفنا رأيتُ مجموعة نساء يُشرنَّ لمارلين، فذهبنا لإلقاءِ التحية، كانت أعيُنهم الفضولية تُحيط بي، لكنني اِلتزمتُ الصَمت أتجول بعيني في المكان.

الجُدران الذهبية، الأرض اللامعة، أصوات الكؤوس والأحاديث، مشاهدٌ كثيرةٌ تمتلئ بالتصنعِ والزيف، وأُخرى تبدو طبيعيةً.. لكن لم أشعرُ بالانتماءِ.

"عزيزتي، سأذهب لإلقاءِ التحيةَ في مكانٍ آخر، انتظريني هُنا"

أومأتُ لها بامتنانٍ داخلي أنها لم تأخذني معها، كدتُ أختنق من ابتسامة المُجاملة لأُناسٍ لا أعرفهم أو يعرفونني.

ظللتُ أبحثُ بعيني عن ساعةٍ ما لكن لم أجد.. قاعةٌ كبيرةٌ كتلك دون ساعةٍ واحدةٍ!

"عُذرًا، أتعلمُ كم الساعةِ الآن؟"

لم يكن بيدي حلًا آخر سوى هذا، والرجل رفع مرفقه أمام عينيه لينظر إلى ساعته.

"إنها الحاديةُ عشر وخمسُ دقائق"

مُتبقٍ ساعة إلا خمس دقائق وما زلتُ لم أعرف الإجابة!

أخشى ما سيحدث إن لم أُعطيه إجابته، لم يبدو لي شخصًا يمزح أو يُهدد.. عليّ الحذر.

"انتظري، لم نتعرف"
وصل صوت ذلك الرجل لأُذني وأنا أذهبُ من أمامه، ربما هُناك شيئًا يُساعدني في رُكنٍ ما.

شيء يجري في الأرض بلا قدمين؟

لكن هناك الكثير من الأشياء!

قصورًا من الأوهام؟ الذكاء؟

أظنه يقصدُ شيئًا معنويًا، شيء لا يُمكننا رؤيته أو لمسه.. بل إنه أشار إلى هذا في اللُغزِ بصريحِ العبارة.

لكن ما هو!

قادتني قدمي نحو غُرفةٍ مُنعزلةٍ في رُكنٍ ما، وكُلما اقتربت خفتت الأصوات تمامًا حتى صِرتُ أسمعَ أصواتًا في الداخلِ، اقتادني الفضول لأقفُ وأستمع، أعلم أنها عادةً سيئةً لكن أخبروا هذا لفضولي!

حاولتُ إمالةَ رأسي للرؤية دون أن يُكشف أمري، لكن لم أرَ سوى رجلٍ عريض المنكبين من ظهره، ويبدو أنه يُحادثُ شخصًا أمامه.

"ما فائدتُكَ إذًا إن كنتَ لا تستطيع حشر فتاةً كتلك في الزاوية، أنت تملُكَ نقطةَ ضعفها بالفعل"

لا أعلم من هذا وعمن يتحدث لكنني شعرتُ بالأسفِ على الفتاة.

"إنها لا تخضعُ بسهولة"

وضعتُ يدي على فمي بصدمةٍ.. ذلك الصوت!

إنه أبي..

جريتُ سريعًا من هُنا للاختباءِ في مكانٍ ما، نبضات قلبي بدأت تتسارعُ بخوفٍ، لا أوده أن يراني هُنا.

ما الذي آتى به هنا، بل مع من كان يتحدث!

تصنمَ جسدي فجأة حين جاءتني لحظةُ إدراك..

هل كان الحديثُ عني؟


نظرتُ حولي بتيهٍ بين الوجوه، لأولِ مرة أُدرك أنني لم أعرفُ أحدًا يومًا، شعرتُ وكأنني خُلقتْ لأُخذل.

نفضتُ مشاعري جانبًا، وتركتُ عقلي يتهاوشُ مع ذلك اللغز، وحينها أدركتُ أن ذلك الرجل يُمثل لي خوفًا وسلامًا، يعزلُ عقلي عن الآلامِ بأُحجياتٍ تُشكل خطرًا على حياةِ شخص آخر!

أغلقت عيني لثوانٍ أُحاول عزل الأصوات، لم يكن يتردد في عقلي سوى صوته: "يجري في الأرضِ بلا قدمين، يُغير وجهة مع كل شمس، يبني قصورًا من الأوهامِ في حضوركِ، ويحفرُ لكِ قاعًا في غيابكِ، لا يُلمس باليد لكنه يذبحُ دون قطرةِ دماءٍ واحدة"

فجأة جرفني أحد النُبلاء في دورة رقص رغمًا عني وهو يبتسم بزيادة: "أنتِ شاردة يا آنستي!"

لم أستمع له، عيني كانت على الساعة الجيبية المُعلَّقة في سُترته، إنها الحاديةُ عشر وأربعون دقيقة!

أمال جسدي للخلفِ يتناغمُ مع الرقصةِ وحينها انسابَ صوت امرأة تُحادث رفيق رقصها.

"حسنًا يا جون، لكن توقف عن النميمة وأحاديثك الناقضة على كلِّ شخص"

شهقتُ داخلي وأنا أُجمع الحلَ في عقلي.. إنها النميمة، تمشي في الأرضِ بين الناس دون أقدام، يُغير وجهه عند كلِّ إنسٍ، وفي حضوري تبقى قصورًا من الأوهامِ يتلاقها الناس، ولا شيء يذبحُ سوى الحديث الجارح والنميمة في الأرض.

بدأتُ أعتذر من الشابِ وأنا أرجعُ للخلفِ وسط الزحام،الأفكار تتضارب كالبرق داخلي.

لم يتبقَ سوى خمسةِ عشرِ دقيقة.. انطلقت خطواتي السريعة أُحاول اختراق الثياب المنفوشة ورائحة العطور الخانقة، بدأت الدقة الأولى لضربة الساعة العاشرة تجلجل في أرجاء القاعة، ولا أعلمُ حتى من أي جهةٍ يأتي ذلك الصوت.

خرجتُ سريعًا أجري على قدمي للعودةِ، لم أُفكر في أي شيء تلك اللحظة سوى أن ألحقَ الموعد.

تسابقتُ مع الهواءِ وأنا أجري بلا توقف، قدمي كانت تؤلمني بوخزٍ بدأ يزداد لكني تحاملتُ عليها.

لم أعلمُ كم من الوقتِ استغرقتُ في الجري، لكنني أسرعتُ أدلفُ فورما وصلتْ، تفاجئتُ بأنَّ الباب لم يكن مُغلَّقًا.. لكن ما لفتَ انتباهي أكثر هو النظر إلى الساعةِ، لم يتبقَ سوى دقيقتين!

أسرعتُ أصعد لغُرفتي أبحثُ عنه لكنه غير موجود، فتشتُ في غُرفةٍ مجاورةٍ ولم أجده، حتى فتحتُ غُرفةً أُخرى حين انسابَ ضؤها إليّ، ووجدته!

كان يقفُ مُستندًا بنصفِ جذعه، مُخفضًا عينيه ينظرُ إلى ساعةِ جيبيه، رفع أنظاره يُطالعني.

وقفتُ أمامه ألهث وشعري ثائر، وعيناي تشتعلان بالتحدي.

اقتربت منه خطوة واحدة، وقلتُ بثقةٍ خفضت لها أنفاسي: "النميمة والحديث السام"

ابتسمَ بسخريةٍ التقطُها فاهتزت ملامحُ الثقةِ من وجهي.

"أحسنتِ يا طبيبة"

للتو تذكرت أنه لقبني بهذا اللقب صباحًا أيضًا، من أين يعرف لا أظن أنني ذكرتُ ذلك وقت الجُرح ربما.

على ذكرِ الجُرح أشعر بأنَّ قدمي تنهارُ مني، أسرعتُ أجلسُ لأتفقده، كانت حالته جيدة لكن قدمي متورمةً قليلًا.. بحثتُ يعيني في الأرجاءِ قليلًا، تلك الغُرفة لم أرها سابقًا.. لكن لم أجد.

"خلفكِ"
نبس يُشيرُ برأسهِ على الرفِ من خلفي، فتحته بصمتٍ لأجدها بالفعلِ أخذتها مُتمتمةً بالشُكرِ ثم بدأتُ بتغيره وهو كان يُتابع بصمتٍ، لم أستطع انتظار ذهابه، أشعرُ بألمٍ شديد.

"لم تُخبرني حل اللغز!"
نبستُ أُطالعه بتحدٍّ تلاشى فورما نطق.

"القفل"

"لم يأخذُ من وقتي سوى سبعِ دقائق"

رفعتُ شفتي العلوية بعدمِ اهتمام، الأهم أنني انتهيتُ من ذلك الكابوس.

عمَّ السكوت مُجددًا، لكن هذا الوقت المُناسب لإلقاءِ الأسئلة.

"الآن حان دوري، الشروط تبقى عندي، سأسألُ بشكلٍ مُباشرٍ وأنت أجب فقط"

"يبحث الغريق دائمًا عن إجاباتٍ قبل أن تبتلعه الهاوية، لكن لن يُغيّر صدى صوتك من حقيقةِ الغرق"
أملتُ رأسي أُقلب كلماته في عقلي، وكأن كلَّ حرفٍ يخرجُ منه يحتاجُ تحليلًا!
إلَامَ يُلمحُ دائمًا؟ هل هو شخصٌ مخذولٌ إلى تلك الدرجة؟ وكأنه لوحةُ ندوبٍ رُسمتْ بأناملٍ كان يجبُ عليها أن تحتضنه.

"كم عُمرك؟"
انسابَ السؤال غفلةً من بين شفتي، ربما أردتُ أن أعرفُ عُمر العقلِ الذي يُخاطبني.

أعطاني ظهره مُتجهًا نحو المكتب، سحبَ ورقةً أمام عيني ثم خط داخلها شيئًا.

مدَّ الورقةَ إليّ فانتشلتُها بفضولٍ.. إنها مُعادلةٌ!

طرقتُ الباب فإذ بروز تفتحُ لي، رحبتْ بي بوجهٍ عابس أثار تساؤلي، لكن استمعتُ لصوتِ نحيبٍ فأسرعتُ للداخلِ أرى ما يحدث.

كانت مارلين تبكي وبجانبها السيدة مارغريت تُحاول مواساتها، لكنها فشلتْ كيفما أرى الآن.

"لقد تعبتُ في ذلك كثيرًا"
نبست وسط بُكائها.

لا أفهم ما الذي يجري.. اِلتفتُ لروز التي تقفُ مُراقبةً الوضع من بعيد.

"ماذا حدث؟"

"لقد احترقت الشركة الجديدة للسيدة مارلين"

هاه!

تقدمتُ نحوها أجلسُ بجانبها، لم يكن بُكائها صاخبًا لكنها بدت حزينة جدًا.. أتفهمُ هذا جيدًا، بالتأكيد وضعت جُهدًا كبيرًا وأموالًا كثيرةً في شكرتها والآن رأت كل ذلك يضيعُ هباءً.

لم أعرفُ تحديدًا ماذا يُمكنني أن أفعلَ في تلك اللحظة، خاصةً مع نظرةِ السيدة مارغريت إليّ، وكأنها تستجدي بي لتهادئتها بالفعلِ.

اقتربتُ أُمسدُ برفقٍ صعودًا ونزولًا على كتفيها مُرددةً

"لا بأس"

رغم أن في داخلها الكثير من البؤسِ.

دموعها بدأت تتوقف لكن ما زالت حزينة عابسة الوجه.


"إن أصبحتِ أفضل يُمكنكِ البوح لي"

قد هدأت تمامًا لكنها ما زالت صامتة، لم تكن تفعل شيء سوى تشارك الصمتِ.

"لا أعلمُ يا إيلاف، أحزنُ على المصنعِ بالتأكيد لكن ليس سببي الرئيسي، لقد رأيتُ النيران بعيني، تلتهمُ كلَّ شيء، حالفني الحظُ ولم أكن بالداخلِ لكن كان هناك أُناسٍ غيري! تأذوا بسببي، سأظلُ أبدَ الدهرِ أحملُ ذنبهم على عاتقيّ!"

شهقتُ بحزنٍ مريرٍ.. ظننته فارغًا لكن هناك من تأذى بالفعل!

ثم أكملت بنبرةٍ أثقل: "اليوم كان الافتتاح، عُمالٌ لأولِ مرةً أراهم ويرونني والآن بالتأكيد نادمين على ذلك"

"هل الأصابات خطيرة إلى هذا الحدِّ؟"
سألتُ بقلقٍ وفي داخلي أدعو أن يكونَ الأمر ليس بذلك السوء الذي تخيلته.

"لا أعلم، لكن حين حدث الحريق كان هُناك ثلاثة أشخاص في الداخلِ بالفعلِ، ذهبوا سريعًا للمشفى لم أرَ شيئًا"

"كيف حدث ذلك الحريق؟"

نفت برأسها بقلةِ حيلةٍ: "لا أعلمُ، كان كلُّ شيء مُجهزًا لكنه اندلعَ فجأةً، إنهم يحققون في الأمرِ بالتأكيد"

"اشربي كوبَ العصير واهدئي أولًا ثم لنذهب سويًا لتفقدهم في المشفى، كل شيء سيصبحُ بخير لا تقلقي"

حاولتُ أن أُطمئنَ قلبها، وهي أومأت بهدوء لكن الحزنَ والقلق ينهشان في روحها الآن بالتأكيد.


أنتظرُ في غُرفتي أن تستعدَ مارلين للذهاب، أصبحت أفضل قليلًا لكنها تشعرُ بالذنبِ، لكنه ليس خطئها!

شردتُ أُفكرُ في سببِ الحريق، كيف يحترقُ مصنعًا كاملًا بلا سبب واضح، الأمر يبدو مُفتعِلًا بوضوحٍ!

ولا أعلمُ لِمَ لكن مرَّ أمام عيني طيفُ ذلك المجهول وهو يبتسمُ بسخريةٍ من خلف وشاحِ وجهه.

فصدحَ صوته في رأسي فجأةً: تخسرين أمامي، فتخسرين شخصٌ تُحبيه، مثلًا مارلين صاحبة المنزل، أليس مارلين صحيحًا؟

نظرتُ حولي بعدمِ تصديق..

هل هو وراء ذلك الأمر؟

نهضتُ بسرعةٍ وخوفٍ شديد، لم أتوقع أن يفعلَ شيئًا!

خرجتُ أذهب لتلك الغرفة سريعًا، لا أعلمُ كيف ولكن تمنيتُ أن يكونَ موجودًا، أن ينفي لي أنه السبب وراء ذلك الحريق.

فتحتُ الباب وأول ما قابلني كان هو، يقفُ في مُنتصفِ الغُرفةِ، يقرأ الأخبارَ تقريبًا.

إنه لم يرفعُ عينيه ليرى من اقتحمَ الغُرفةِ بتلك الهمجية، ما زال نظره مُعلَّق على ما في يديه.

"أنت"
نطقتُ بحدةٍ جعلته يرفعُ عينيه، ثم دلفتُ أُغلِقُ الباب من خلفي، إنه يتعامل وكأنه منزله بالفعل، لا يخشى شيء، لا يتصرفُ وكأنه دخيلٌ هنا!

يُناظرني وكأنني شيءٌ غريب، غير مألوفةٍ له.. عيناه تتجولُ في وجهي بحُريةٍ، ينظرُ بثقةٍ لم تذهب من عينيه منذ ما اِلتقينا.. نظرةٌ مُختلطةٌ بين الجفاء والبرودة والثقة وشيءٌ صغيرٌ من الدفءِ، يكاد لا يُرى.

بعثرَ شعره بيديه فجأة يُقلبُ عينيه عني، ثم ذهبَ ليجلس على المقعدِ بهدوء واضعًا تلك الجريدة فوق الطاولة لتجذبَ نظري إليها، خبرٌ ببونطٍ عريضٍ يتوسطها:
في الساعةِ الثانية عشر وستة عشر دقيقة اشتعلَ حريقٌ مُسببًا أضرارًا كثيرةً في مصنعٍ لم يكتمل افتتاحه ليومٍ واحدٍ.

احتدَّت عيني أنظرُ له تلك المرة، رغم عدم رؤيتي لشيءٍ سوى عينيه لكن أشعر بأن ملامحه خاويةٍ، لا تعبير يسكُنها.

"أنت مُفتعل الحريق"

نبستُ بنبرةٍ اتهاميةٍ، لم يكن سؤالًا بل معلومةً أُلقيها عليه.

انكمش حاجبيه نظرًا لتحرُك أطراف خُصلاته المُتناثرة والتي بدت تحجُبُ عينيه قليلًا عني.

"افتعلتَ حريقًا لأنني تأخرتْ، تأذى أُناسٌ أبرياءٌ بسببك!"

حاولتُ اخفاض صوتي لألا يستمعُ إليه أحد، لكنني لم أستطع كبح حدتي بل وتفجأتُ بنفسي أخطو له إلى أن وقفتُ أمامه، غضبي هو مُحركي الوحيد الآن.

"أنتَ كيف تفعلُ ذلك!"

لم ينظرُ لوجهي بهذا القُرب، بل ابتعدَ نحو النافذةِ.

"أخبرتُكِ أن هناك عواقب لذلك"

"عن أي عواقبٍ تتحدثُ، أقول لكَ أن هناك من تأذى بسببك، من يرقدُ في فراشِ المشفى الآن بينما أنتَ تقفُ على قدميك أمامي، من يبكي حُزنًا بسبب ذلك الحادث وأنت هُنا لا تملك ذرةَ ندمٍ!"

"بل بسببكِ"

ماذا يقول؟

"أنتِ من اخترتِ ذلك، أخبرتُكِ أن لكلِّ شيءٍ عواقب، لماذا تُلقي اللوم عليّ الآن بدلًا من تحملُ أخطاءكِ"

رجعتُ خطوةً للخلفِ بعدمِ فهم، إنه يرى أنني المُذنبة.

أنا من اخترت؟

ظللنا نتبادلُ النظرات، هو عينيه خاوية وأنا عيني تائهة.

"آليستر"

وجدتُ نفسي أهمسُ باسمه أمامه، وكأنني أردتُ اخباره بمعرفتي، ومن نظرةِ عينيه التي توسعت بتفاجؤٍ علمتُ أنه اسمه بالفعلِ.

لم أنتظر أكثر من ذلك، خرجتُ أرغبُ بالهروبِ، الاختلاء بنفسي عن الجميعِ.

لكن تذكرتُ الوعد الذي قطعته لمارلين، يجبُ أن أذهبَ معها.


كانت طوال الطريق صامتة عكس عادتها، لكن كلُّ ما أحتاجه هو ذلك الصمت بالفعلِ.

ظللتُ أُفكرُ كيف يُمكنني استدراجه، أردتُ أن أذهبَ للشرطةِ، أن أُقدمَ بلاغًا ضده بتُهمةِ افتعال الحريق.

"هُنا"

ترجلنا سويًا من السيارةِ إلى الداخلِ، قابلتنا رائحة المشفى، تلك الرائحة والجُدران البيضاء، أصوات المرضى وحالات الانتظار، رؤية كل شخصٍ في عالمٍ مُختلفٍ.

هذا المشهد قد يبدو للبعضِ كابوسًا، ذلك الرواق والممرات المنفصلة شاهدوا الكثير من الآلامِ والوفيات، الكثير من الدماءِ والصُراخ.

وأنا كنتُ أرى هُنا حُلمي وماضيَّ.

سألنا عن قسمِ الحرائقِ ثم اتجهنا نحوه وكلتانا صامتين.

"تلك الغُرفة"
نبست تُشير إلى غُرفةٍ في ذلك الطابقِ.

كانت متوترةً، ربما تخشى من ردةِ فعلهم أو أن يلقوا عليها اللومِ.

لا يعلمون أنني المُذنبةُ الحقيقةِ هنا.

طرقتُ وأنا أشدُّ على يديها لطمئن.. فنظرت إلي تبتسمُ ابتسامةً لم تخرجُ من قلبِها، ابتسامة تُعبرُ عن دواخلها.

دخلتُ أولًا بعد تصريحِ الدخولِ وهي خلفي.

كانت الغرفةُ مُنقسمةً بستائرِ بين كلِّ سريرٍ وآخر.

كانوا الثلاثةَ في نفسِ الغرفةِ، لم يكن هناك مُرافقين كُثر من حُسنِ الحظِ.

قدتُ خطواتي نحو أولِ سريرٍ، كان الرجلُ مُمددًا على الفراشِ وبجانبه امرأة بدت كزوجته.

"يُمكننا مُرافقتكم قليلًا؟"

تساءلتُ مُبتسمةً بلُطفٍ في وجههم، الرجل تبسَّم في وجهنا لكن المرأة ابتسمت بترحيبٍ وعدم فهم.. لم تتعرف علينا.

"تلك السيدة مارلين صاحبة العملِ."

قالَ الرجل لزوجته مُعرفًا عن هويتنا، فبدأت ابتسامتها تتلاشى دون أن تنطق حرفًا.

تنحنحُ الرجلُ يُشير إلى المقعدين بجانبه:

"تفضلوا"

جلسنا أتفحصه بعيني، الحرقُ كان في يديه اليُسرى.

"أنا إيلاف صديقةُ مارلين، لم تهدأ دون أن تأتي لزيارتكم"

"أعتذرُ عمَّ حدث، لكن كل شيء يُشير إلى أنه كان حريقًا مُفتعلًا، أتمنى ألا تكون حانقًا عليّ، أعلمُ أنَّ لا شيء يعوضُ الألم والخوف في تلك اللحظة، لكن أتمنى أن تقبلَ التعويض مني"

ابتسمَ الرجل في وجهها برضا، ربما شعر بصدقِ حديثها.

"لا بأس، ليس ذنبُكِ يا ابنتي"

رغم نظرات زوجته الغير راضيةً لكنه أدخل الاطمئنان لقلوبنا.. فانسحبنا نُغادرُ بعدما تركت هي ظرفًا على طاولةِ العلاج الصغيرة.

واتخذنا خطواتنا للسرير الآخر، كان شابًا في مُقتبلِ العمرِ بمفرده تلك المرةِ، لكنه كان يتألمُ، جسده مشدود من أثرِ الألم، ووجهه ينضج بالعرقِ برغم برودة المكيف، كانت الحروق من الدرجة الثانية المتقدمة تغطي جزءًا كبيرًا من ذراعه وأعلى صدره، مطهرات الحروق تملأ المكان، برغم ثقل المشهد، إلا أنني أسرعتُ للمُساعدة بينما ذهبت مارلين لتُنادي أحدًا مَن الطاقمِ الطبي.

اقتربت من السرير بثبات، بحثتُ عن قفزاتٍ لارتدائها، ثم نظرت إلى عينيه المجهدتين أُحاولُ أن أبثُ في داخله الاطمئنان.

"أعلمُ أنَّ مرحلة تغيير الضماد صعبة، سأحاولُ أن أجعلَ يدي خفيفةً جدًا، لكن أولًا سأُساعدك لنزعِ الملابس العلوية عن جسدكَ، احتكاك القُماش في الجلدِ المُحترق يُسبب لكَ ألمًا، مستعد؟"

أومأ برأسه ببطءٍ دون أن يتكلمَ، وجسده متصلب انتظارًا للألم المتوقع، بدأت بمُساعدته حتى خرجَ من رأسه بسلام، ثم بدأتُ العمل بحركات دقيقة وحريصة، لم أسحبُ الشاشَ القديم بقوةٍ لكي لا يتألمُ، بل أخذت أنقع الأطراف الملتصقة بمحلول الملح ببطء شديد، قطرة بقطرة، حتى بدأ الضماد ينفصل عن الجلد المحترق بسهولة ودون أن يدمي الجرح، أغمض هو عينيه وشبّك يديه بقوة من شدة اللسعة، حين لاحظت ذلك توقفت لثوانٍ، وبصوت هادئ حاولتُ تخفيف ألمه: "خذ نفسًا عميقًا من أنفكِ وأخرجه من فمكِ برفقٍ، التنفس سيُساعد العضلات لترتخي، كدنا ننتهي."

بعد إزالة الضماد القديم، بدأتُ بتطهير الجرح بمادة خفيفة، ثم فتحتُ مرهم الترميم الخاص بالحروق، لأدهنه بمسحاتٍ هادئة ولطيفة باستخدام أداة خشبية عقمتُها أولًا مع الحرص على تغطية كافة الأنسجة المتضررة لتهدئة الالتهاب.

لم أعلمُ ماذا كنتُ سأفعل إن لم أجدَ تلك الأدوات من حولي

شعر هو ببرودة المرهم تمتص السخونة المشتعلة في جلده، فبدأت ملامحه المشدودة ترتخي تدريجيًا، فأحضرت طبقات الشاش االخاص بالضماد الجديد، ووضعتها بعناية كي لا تلتصق بالجلد مستقبلًا، ثم بدأت بلف الشاش الخارجي برفق ودون ضغط زائد يمنع تدفق الدم، ثم نظرت إليه وابتسمت ابتسامة مشجعة..

"أيامٌ جديدةٌ وسيبدأ النسيج الجديد بالتكون، أنت فقط ابتعد عن مُلاسمة الجرح بالملابس وغيرها، وإن كنت تشعرُ بالألمِ لا تبقى هادئًا هكذا بل اطلب المُساعدة، هل أنت أفضل الآن؟"

كنتُ أمدُّ يدي بكوبٍ من الماءِ برفقةِ حبة العلاج لتسكنة الألم قليلًا.. وهو أخذه مني يبتلعه بينما يتنفس الصعداء، ثم نظر إلى يده الملفوفة بانتظام ونظافة تامة، ثم رفع عينيه إليّ نور وقال بنبرة يملؤها الامتنان: "كنت أشعرُ بالألم الشديد وأخشى أن يشتدُ عليّ مع التغيير الجديد، لكن يداكِ خفيفةٌ ولم أشعرُ بدات الألم شكرًا لكِ."

نزعت القفازات لأضعها في سلة المهملات الطبية، ثم عدلت جُزءًا من الغطاء عليه وأنا أبتسمُ له.

ذلك الشعور هو ما كنتُ أبحث عنه دائمًا، تلك الابتسامة المُمتنة، ذلك الشكرُ الخالص والصادق، واللمعة الخفيضة بالراحةِ في عينِ المريض، إنهم يُحيوا شيئًا داخلي، شيئًا لطلما كان ميتًا منذُ وقتٍ طويلٍ.. فعاهدتُ نفسي أن أعيشَ على اسعادِ غيري، على مُساعدته، ربما حينها فقط تتلاشى ذنوبي.

"أنتِ جيدةٌ للغايةِ"

اِلتفتُ أنظرُ لذلك الصوت الغيرُ مألوف، كان رجُلًا كبيرًا في السنِ، اللون الأبيض يملأ شعره، والتجاعيد تحتلُ خطوط وجهه، لكنه بدا بشوشًا، يرتدي زيُّ الطبيب وذلك المعطفُ الأبيض.. المعطفُ الذي يُدفئ شيئًا في روحي، بجانبه كانت تقفُ مارلين، يبدو أنهم يُتابعون منذُ وقتٍ.

ابتسمتُ له بصمتٍ، أعلمُ أنني أُجيد ذلك فلم يمر عليّ يومًا منذ ما وعيتُ على الدُنيا إلا وأنا أُراقبُ طبيبًا في عيادةٍ ما، أو أقرأ كتابًا يشرحُ عن الطبِ.

فلا حظ لي بما أوده سوى لذةِ النظر.

تقدمت مارلين تُحادثُ الشاب، بينما وقفتُ بعيدًا أنظر لهم..

اقتربَ ذلك الرجل يُحادثني: "كنت أبحثُ عن فتاةٍ مُجتهدةٍ تُساعدني في عيادتي الخاصةِ، أظن أنني وجدتُكِ أخيرًا، ما رأيُكِ؟"

نظرتُ إليه بعدمِ تصديق، هل ما سمعته صحيحًا!

ابتسمتُ باتساعٍ فجأة أومئ برأسي:
"موافقة بالطبع"

function seedDefaultBook() {
  if (localStorage.getItem(SEED_KEY)) return;
  const books = getBooks();
  if (books.find(b => b.id === 'zaha-default-001')) {
    localStorage.setItem(SEED_KEY, 'true');

  }
  const defaultBook = getDefaultBook();
  books.unshift(defaultBook);
  saveBooks(books);
  localStorage.setItem(SEED_KEY, 'true');
}

/* ============================================================
   📐 REAL PAGE MEASUREMENT
   ============================================================ */
function createMeasureElement(design) {
  const d = design || defaultDesign();
  const dims = PAGE_DIMENSIONS[d.pageSize] || PAGE_DIMENSIONS['A5'];
  const marginMm = d.margin * 0.264;
  const contentWidthMm = Math.max(20, dims.width - marginMm * 2);
  const contentHeightMm = Math.max(20, dims.height - marginMm * 2);

  const el = document.createElement('div');
  el.style.cssText = `
    position: fixed;
    left: -99999px;
    top: 0;
    width: ${contentWidthMm * MM_TO_PX}px;
    height: ${contentHeightMm * MM_TO_PX}px;
    font-family: '${d.fontFamily}', 'Amiri', sans-serif;
    font-size: ${d.fontSize}px;
    line-height: ${d.lineHeight};
    direction: ${d.direction};
    text-align: ${d.direction === 'rtl' ? 'right' : 'left'};
    overflow: hidden;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: break-word;
    box-sizing: border-box;
    visibility: hidden;
    pointer-events: none;
  `;
  document.body.appendChild(el);
  return el;
}

function measureRealCharsPerPage(design, sampleText = null) {
  const d = design || defaultDesign();
  const sample = sampleText || (
    'في قديم الزمان كان هناك رجلٌ يعيش في قريةٍ صغيرةٍ على أطراف المدينة، ' +
    'وكان له من الأولاد ثلاثة، يكبرهم جميعًا حكيمٌ يمتلك قلبًا طيبًا وعقلًا راجحًا. ' +
    'وفي أحد الأيام قرر أن يرحل إلى المدينة بحثًا عن عملٍ يُعينه على متاعب الحياة. ' +
    'فقال له والده: يا بني إن الدنيا دار ممرٍ لا دار مقرٍ، فاتقِ الله فيها واعمل صالحًا. '
  ).repeat(20);

  const measureEl = createMeasureElement(d);
  const containerHeight = measureEl.clientHeight;

  let low = 0, high = sample.length, best = 0;
  while (low <= high) {
    const mid = Math.floor((low + high) / 2);
    measureEl.textContent = sample.slice(0, mid);
    if (measureEl.scrollHeight <= containerHeight + 1) {
      best = mid;
      low = mid + 1;
    } else {
      high = mid - 1;
    }
  }

  document.body.removeChild(measureEl);
  return Math.max(50, best);
}

function getCachedCharsPerPage(design) {
  const key = [
    design.pageSize, design.fontFamily, design.fontSize,
    design.lineHeight, design.margin, design.direction
  ].join('|');
  if (_measureCache.has(key)) return _measureCache.get(key);
  const v = measureRealCharsPerPage(design);
  _measureCache.set(key, v);
  return v;
}

/* ============================================================
   ✂️ SMART TEXT SPLITTING
   ============================================================ */
function findSmartCutoff(text, target) {
  const minCut = Math.max(1, Math.floor(target * 0.7));
  const maxCut = Math.min(text.length, Math.floor(target * 1.15));

  for (let i = maxCut; i >= minCut; i--) {
    if (text[i] === '\n' && text[i - 1] === '\n') return i + 1;
  }
  const enders = ['.', '؟', '!', '۔', ':', '،', '\n'];
  for (let i = maxCut; i >= minCut; i--) {
    if (enders.includes(text[i])) {
      const next = text[i + 1];
      if (!next || /\s/.test(next) || next === '\n') return i + 1;
    }
  }
  for (let i = maxCut; i >= minCut; i--) {
    if (/\s/.test(text[i])) return i + 1;
  }
  for (let i = target; i < Math.min(text.length, target + 30); i++) {
    if (/\s/.test(text[i])) return i + 1;
  }
  return target;
}

function splitIntoPages(chapters, design) {
  const charsPerPage = getCachedCharsPerPage(design);
  const pages = [];

  chapters.forEach((ch, chIdx) => {
    const content = (ch.content || '').trim();
    if (!content && chIdx !== 0) return;

    let remaining = content || ' ';
    let firstPage = true;

    while (remaining.length > 0) {
      let slice;
      if (remaining.length <= charsPerPage) {
        slice = remaining;
        remaining = '';
      } else {
        const cutoff = findSmartCutoff(remaining, charsPerPage);
        slice = remaining.slice(0, cutoff);
        remaining = remaining.slice(cutoff).trimStart();
      }

      pages.push({
        chapterIndex: chIdx,
        chapterTitle: firstPage ? ch.title : null,
        content: slice.trim(),
        isChapterStart: firstPage
      });

      firstPage = false;
    }
  });

  return pages;
}
