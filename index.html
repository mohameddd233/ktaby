<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#173c36" />
<title>كتابي — نظام إنشاء الكتب v5.2</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<link rel="stylesheet" href="styles.desktop.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>

<nav class="navbar">
  <h1><span class="brand-mark" aria-hidden="true"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v17H7.5A3.5 3.5 0 0 0 4 22z"/><path d="M4 5.5v13A3.5 3.5 0 0 1 7.5 15H20"/></svg></span> كتابي <small style="font-size:11px;opacity:0.7">v5.2</small></h1>
  <div class="nav-actions">
    <button class="btn btn-light" onclick="goHome()" aria-label="المكتبة"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7"/><path d="M5 9v12h14V9M9 21v-7h6v7"/></svg><span class="label-full">المكتبة</span></button>
    <button class="btn btn-light" onclick="toggleDarkMode()" title="الوضع الليلي" aria-label="الوضع الليلي"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5 8.5 8.5 0 1 0 20.5 15.5Z"/></svg></button>
    <button class="btn btn-light" onclick="exportAllBooks()" title="نسخة احتياطية" aria-label="نسخة احتياطية"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4m-5 5 5-5 5 5"/><path d="M5 13v7h14v-7"/></svg></button>
    <button class="btn btn-light" onclick="document.getElementById('importAllInput').click()" title="استيراد" aria-label="استيراد"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m-5-5 5 5 5-5"/><path d="M5 16v4h14v-4"/></svg></button>
    <button class="btn btn-primary" onclick="createNewBook()"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="label-full">كتاب جديد</span></button>
  </div>
  <input type="file" id="importAllInput" accept=".json" class="hidden" onchange="importAllBooks(event)">
</nav>

<div class="container" id="app"></div>

<button class="fab" id="fab" onclick="createNewBook()">+</button>

<footer class="site-footer">
  تصميم وبرمجة <strong>Mohamed Ali</strong> © 2026 — الإصدار 5.2
</footer>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<div class="mobile-bottom-bar hidden" id="mobileBar">
  <button class="btn btn-success" onclick="saveCurrentBook()">💾 حفظ</button>
  <button class="btn btn-primary" onclick="openViewer(currentEditingId)">👁️ عرض</button>
  <button class="btn btn-outline" onclick="exportPDF(currentEditingId)">📄 PDF</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
