function buildPages(book) {
  if (_pagesCache.has(book.id)) {
    const cached = _pagesCache.get(book.id);
    if (cached.updatedAt === book.updatedAt) return cached.pages;
  }

  const d = book.design || defaultDesign();
  const pages = [];

  pages.push({
    type: 'frontCover',
    cover: book.cover,
    title: book.title,
    author: book.author
  });

  pages.push({
    type: 'title',
    title: book.title,
    author: book.author,
    category: book.category
  });

  const chapters = (book.chapters || []).filter(c => c.title || c.content);
  const contentPages = splitIntoPages(chapters, d);
  contentPages.forEach(p => pages.push({ type: 'content', ...p }));

  pages.push({ type: 'endPage', title: book.title });

  pages.push({
    type: 'backCover',
    cover: book.backCover || '',
    title: book.title,
    author: book.author,
    description: book.description
  });

  _pagesCache.set(book.id, { pages, updatedAt: book.updatedAt });
  return pages;
}

/* ============================================================
   🧭 NAVIGATION
   ============================================================ */
function goHome() {
  currentEditingId = null;
  document.getElementById('mobileBar').classList.add('hidden');
  document.getElementById('fab').classList.remove('hidden');
  renderLibrary();
}
function createNewBook() {
  const b = newBook();
  upsertBook(b);
  openEditor(b.id);
}
function openEditor(id) {
  currentEditingId = id;
  currentTab = 'content';
  renderEditor();
}

/* ============================================================
   📚 LIBRARY
   ============================================================ */
function renderLibrary() {
  const app = document.getElementById('app');
  const books = getBooks();

  if (books.length === 0) {
    app.innerHTML = `
      <div class="empty-state">
        <div class="icon">📖</div>
        <h3>مكتبتك فارغة</h3>
        <p>ابدأ بإنشاء أول كتاب لك الآن</p>
        <button class="btn btn-primary" onclick="createNewBook()">➕ إنشاء كتاب جديد</button>
      </div>`;
    return;
  }

  app.innerHTML = `
    <div class="library-header">
      <div>
        <h2>📚 مكتبتي</h2>
        <p>${books.length} كتاب في مكتبتك</p>
      </div>
      <button class="btn btn-primary" onclick="createNewBook()">➕ كتاب جديد</button>
    </div>
    <div class="books-grid">
      ${books.map(b => bookCardHtml(b)).join('')}
    </div>`;
}

function bookCardHtml(b) {
  const cover = b.cover
    ? `<img src="${b.cover}" class="book-cover" alt="cover">`
    : `<div class="book-cover">${escapeHtml((b.title || 'ك')[0])}</div>`;
  const chaptersCount = (b.chapters || []).length;
  const dir = detectBookDirection(b);
  const dirLabel = dir === 'rtl' ? 'عربي' : 'إنجليزي';
  return `
    <div class="book-card">
      ${cover}
      <div class="book-info">
        <h3 title="${escapeHtml(b.title)}">${escapeHtml(b.title)}</h3>
        <div class="author">${escapeHtml(b.author || 'مؤلف مجهول')}</div>
        <div class="meta">
          <span>${chaptersCount} فصل</span>
          <span>${dirLabel}</span>
        </div>
      </div>
      <div class="card-actions">
        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation();openEditor('${b.id}')" title="تعديل">✏️</button>
        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openViewer('${b.id}')" title="عرض">👁️</button>
        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation();confirmDelete('${b.id}')" title="حذف">🗑️</button>
      </div>
    </div>`;
}

function confirmDelete(id) {
  const b = getBook(id);
  if (!b) return false;
  if (confirm(`هل أنت متأكد من حذف "${b.title}"؟`)) {
    deleteBook(id);
    toast('تم حذف الكتاب', 'success');
    if (currentEditingId === id) goHome();
    else renderLibrary();
    return true;
  }
  return false;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  const tabs = ['content', 'info', 'preview', 'design'];
  const idx = tabs.indexOf(tab);
  if (idx >= 0) document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById('tab-content').classList.toggle('hidden', tab !== 'content');
  document.getElementById('tab-info').classList.toggle('hidden', tab !== 'info');
  document.getElementById('tab-preview').classList.toggle('hidden', tab !== 'preview');
  document.getElementById('tab-design').classList.toggle('hidden', tab !== 'design');
  if (tab === 'preview') renderPreview();
}

/* ============================================================
   📝 CHAPTERS
   ============================================================ */
function renderChapters() {
  const b = getBook(currentEditingId);
  if (!b) return;
  const list = document.getElementById('chaptersList');
  const openStates = new Set();
  document.querySelectorAll('.chapter-item.open').forEach(el => {
    const m = el.id.match(/ch-(\d+)/);
    if (m) openStates.add(+m[1]);
  });
  if (openStates.size === 0) openStates.add(0);

  list.innerHTML = (b.chapters || []).map((c, i) => `
    <div class="chapter-item ${openStates.has(i)?'open':''}" id="ch-${i}">
      <div class="chapter-header" onclick="toggleChapter(${i})">
        <span>📖 ${escapeHtml(c.title || 'فصل')}</span>
        <button class="btn btn-danger btn-xs" onclick="event.stopPropagation();removeChapter(${i})">🗑️</button>
      </div>
      <div class="chapter-body">
        <div class="form-group">
          <label>عنوان الفصل</label>
          <input type="text" value="${escapeHtml(c.title)}" oninput="updateChapter(${i}, 'title', this.value)">
        </div>
        <div class="form-group">
          <label>محتوى الفصل</label>
          <textarea rows="8" oninput="updateChapter(${i}, 'content', this.value)" placeholder="اكتب محتوى الفصل هنا...">${escapeHtml(c.content)}</textarea>
        </div>
      </div>
    </div>`).join('');
}

function toggleChapter(i) {
  document.getElementById(`ch-${i}`).classList.toggle('open');
}
function addChapter() {
  const b = getBook(currentEditingId);
  b.chapters.push({ title: `فصل ${b.chapters.length + 1}`, content: '', order: b.chapters.length });
  b.updatedAt = Date.now();
  upsertBook(b);
  renderChapters();
  toast('تمت إضافة فصل جديد', 'success');
}
function removeChapter(i) {
  const b = getBook(currentEditingId);
  if (b.chapters.length === 1) { toast('لا يمكن حذف الفصل الأخير', 'error'); return; }
  if (!confirm('حذف هذا الفصل؟')) return;
  b.chapters.splice(i, 1);
  b.updatedAt = Date.now();
  upsertBook(b);
  renderChapters();
}
function updateChapter(i, field, value) {
  const b = getBook(currentEditingId);
  b.chapters[i][field] = value;
  b.updatedAt = Date.now();
  _pagesCache.delete(b.id);
  debounce(`chapter-${i}-${field}`, () => upsertBook(b), 400);
}

/* ============================================================
   ✏️ FIELDS / DESIGN
   ============================================================ */
function updateField(field, value) {
  const b = getBook(currentEditingId);
  b[field] = value;
  b.updatedAt = Date.now();
  _pagesCache.delete(b.id);
  debounce(`field-${field}`, () => upsertBook(b), 400);
}

function updateDesignLive(field, value) {
  const b = getBook(currentEditingId);
  if (!b.design) b.design = defaultDesign();
  b.design[field] = value;
  b.updatedAt = Date.now();
  _measureCache.clear();
  _pagesCache.delete(b.id);

  const labelMap = {
    fontSize: { id: 'lbl-fontSize', prefix: 'حجم الخط: ', suffix: 'px' },
    lineHeight: { id: 'lbl-lineHeight', prefix: 'ارتفاع السطر: ', suffix: '' },
    margin: { id: 'lbl-margin', prefix: 'الهوامش: ', suffix: 'px' }
  };
  const info = labelMap[field];
  if (info) {
    const lbl = document.getElementById(info.id);
    if (lbl) lbl.textContent = info.prefix + value + info.suffix;
  }

  debounce(`design-${field}`, () => upsertBook(b), 400);

  if (currentTab === 'preview') {
    debounce('preview-refresh', renderPreview, 600);
  }
}

function updateDesign(field, value) {
  const b = getBook(currentEditingId);
  if (!b.design) b.design = defaultDesign();
  b.design[field] = value;
  b.updatedAt = Date.now();
  _measureCache.clear();
  _pagesCache.delete(b.id);
  upsertBook(b);

  if (field === 'pageSize' || field === 'autoDirection') {
    renderEditor();
    setTimeout(() => switchTab('design'), 10);
    return;
  }
  if (currentTab === 'preview') renderPreview();
}

/* ============================================================
   🖼️ COVERS
   ============================================================ */
function handleCover(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('حجم الصورة كبير! الحد الأقصى 2MB', 'error');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    const b = getBook(currentEditingId);
    b.cover = ev.target.result;
    b.updatedAt = Date.now();
    upsertBook(b);
    renderEditor();
    switchTab('info');
    toast('تم رفع الغلاف الأمامي', 'success');
  };
  reader.readAsDataURL(file);
}
function removeCover() {
  const b = getBook(currentEditingId);
  b.cover = '';
  b.updatedAt = Date.now();
  upsertBook(b);
  renderEditor();
  switchTab('info');
}

function handleBackCover(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) {
    toast('حجم الصورة كبير! الحد الأقصى 2MB', 'error');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = ev => {
    const b = getBook(currentEditingId);
    b.backCover = ev.target.result;
    b.updatedAt = Date.now();
    upsertBook(b);
    renderEditor();
    switchTab('info');
    toast('تم رفع الغلاف الخلفي', 'success');
  };
  reader.readAsDataURL(file);
}
function removeBackCover() {
  const b = getBook(currentEditingId);
  b.backCover = '';
  b.updatedAt = Date.now();
  upsertBook(b);
  renderEditor();
  switchTab('info');
}

/* ============================================================
   💾 SAVE
   ============================================================ */
function saveCurrentBook() {
  const b = getBook(currentEditingId);
  if (!b) return;
  b.updatedAt = Date.now();
  upsertBook(b);
  toast('تم حفظ الكتاب بنجاح ✅', 'success');
}

/* ============================================================
   👁️ PREVIEW
   ============================================================ */
function renderPreview() {
  const b = getBook(currentEditingId);
  if (!b) return;
  const d = { ...(b.design || defaultDesign()) };
  d.direction = detectBookDirection(b);
  const pages = buildPages(b);
  const container = document.getElementById('previewContainer');

  const spreads = [];
  for (let i = 0; i < pages.length; i += 2) {
    spreads.push({
      left: pages[i],
      right: pages[i + 1] || { type: 'blank' },
      leftIndex: i,
      rightIndex: i + 1 < pages.length ? i + 1 : -1
    });
  }

  container.innerHTML = `
    <div class="preview-toolbar">
      <button class="btn btn-outline btn-sm" onclick="previewGo(-1)">◀ السابق</button>
      <span id="previewIndicator" class="preview-indicator">1 / ${spreads.length}</span>
      <button class="btn btn-outline btn-sm" onclick="previewGo(1)">التالي ▶</button>
    </div>
    <div class="preview-spread-container">
      ${spreads.map((s, idx) => `
        <div class="preview-spread" data-spread="${idx}" data-dir="${d.direction}" style="display:${idx === 0 ? 'flex' : 'none'}">
          <div class="preview-spread-page">
            ${renderPreviewPage(s.left, d, s.leftIndex)}
          </div>
          <div class="preview-spread-page">
            ${renderPreviewPage(s.right, d, s.rightIndex)}
          </div>
        </div>
      `).join('')}
    </div>
    <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--muted)">
      📖 ${spreads.length} صفحة مزدوجة — الاتجاه: ${d.direction === 'rtl' ? 'عربي (يمين ←)' : 'إنجليزي (→ شمال)'}
    </div>
  `;

  _previewSpreadIndex = 0;
  _previewSpreadsCount = spreads.length;
  updatePreviewIndicator();
}

function previewGo(delta) {
  let idx = _previewSpreadIndex + delta;
  if (idx < 0) idx = 0;
  if (idx >= _previewSpreadsCount) idx = _previewSpreadsCount - 1;
  _previewSpreadIndex = idx;
  document.querySelectorAll('.preview-spread').forEach((el, i) => {
    el.style.display = i === idx ? 'flex' : 'none';
  });
  updatePreviewIndicator();
}

function updatePreviewIndicator() {
  const el = document.getElementById('previewIndicator');
  if (el) el.textContent = `${_previewSpreadIndex + 1} / ${_previewSpreadsCount}`;
}

function renderPreviewPage(p, d, index) {
  const baseStyle = `
    background-color:${d.pageColor};
    color:${d.textColor};
    font-family:'${d.fontFamily}',sans-serif;
    font-size:${d.fontSize}px;
    line-height:${d.lineHeight};
    direction:${d.direction};
  `;

  if (p.type === 'frontCover') {
    if (p.cover) {
      return `<div class="preview-page" style="padding:0;background:#000;position:relative;min-height:500px">
        <img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0">
      </div>`;
    }
    return `<div class="preview-page" style="padding:0;background:linear-gradient(135deg,#8b5e34,#5c3d1f);position:relative;min-height:500px;display:flex;align-items:center;justify-content:center;color:white;text-align:center">
      <div style="padding:40px">
        <h1 style="font-family:'Amiri',serif;font-size:2.5em;color:#d4a373;margin-bottom:20px">${escapeHtml(p.title)}</h1>
        <p style="opacity:0.9">${escapeHtml(p.author || '')}</p>
      </div>
    </div>`;
  }

  if (p.type === 'backCover') {
    if (p.cover) {
      return `<div class="preview-page" style="padding:0;background:#000;position:relative;min-height:500px">
        <img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:brightness(0.55)">
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.92),transparent);padding:40px;display:flex;flex-direction:column;justify-content:flex-end;color:white">
          <h2 style="color:#d4a373;margin-bottom:12px">${escapeHtml(p.title)}</h2>
          <p style="opacity:0.9;font-size:0.9em">${escapeHtml(p.description || '')}</p>
        </div>
      </div>`;
    }
    return `<div class="preview-page" style="padding:40px;background:linear-gradient(135deg,#5c3d1f,#8b5e34);position:relative;min-height:500px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center">
      <h2 style="font-family:'Amiri',serif;font-size:1.8em;color:#d4a373;margin-bottom:20px">${escapeHtml(p.title)}</h2>
      <p style="opacity:0.9;font-size:0.9em">${escapeHtml(p.description || '')}</p>
      <div style="margin-top:30px;font-size:24px;opacity:0.5">✦ ✦ ✦</div>
    </div>`;
  }

  if (p.type === 'title') {
    return `<div class="preview-page ${d.paperStyle}" style="${baseStyle};text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center">
      <h1 style="font-size:2em;margin-bottom:20px">${escapeHtml(p.title)}</h1>
      ${p.author ? `<p style="font-size:1.2em;opacity:0.7;margin-bottom:16px">${escapeHtml(p.author)}</p>` : ''}
      ${p.category ? `<p style="opacity:0.5">${escapeHtml(p.category)}</p>` : ''}
    </div>`;
  }

  if (p.type === 'endPage') {
    return `<div class="preview-page ${d.paperStyle}" style="${baseStyle};text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center">
      <div style="font-size:48px;margin-bottom:20px;opacity:0.5">✦</div>
      <h2 style="font-family:'Amiri',serif;font-size:1.5em;margin-bottom:16px;opacity:0.7">النهاية</h2>
    </div>`;
  }

  if (!p || p.type === 'blank') {
    return `<div class="preview-page" style="${baseStyle}"></div>`;
  }

  return `<div class="preview-page ${d.paperStyle}" style="${baseStyle};padding:${d.margin}px;box-sizing:border-box;display:flex;flex-direction:column">
    ${d.headerText ? `<div class="preview-header">${escapeHtml(d.headerText)}</div>` : ''}
    <div style="flex:1;min-height:0;overflow:hidden">
      ${p.chapterTitle ? `<h2 style="margin:0 0 16px 0;font-size:1.5em">${escapeHtml(p.chapterTitle)}</h2>` : ''}
      <div style="white-space:pre-wrap;overflow-wrap:break-word">${escapeHtml(p.content) || ''}</div>
    </div>
    ${d.footerText ? `<div class="preview-footer">${escapeHtml(d.footerText)}</div>` : ''}
    ${d.showPageNumbers && index >= 0 ? `<div style="text-align:center;font-size:12px;color:#999;margin-top:10px">${index + 1}</div>` : ''}
  </div>`;
}

/* ============================================================
   📖 BOOK VIEWER
   ============================================================ */
function openViewer(id) {
  const b = getBook(id);
  if (!b) return;
  viewerBook = b;
  const pages = buildPages(b);
  viewerLeaves = pagesToLeaves(pages);
  viewerLeafIndex = 0;
  _isAnimating = false;
  renderViewer();
  document.getElementById('modal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function pagesToLeaves(pages) {
  if (!pages || pages.length === 0) return [];

  const padded = [...pages];
  while (padded.length % 2 !== 0) {
    padded.push({ type: 'blank' });
  }

  const leaves = [];
  for (let i = 0; i < padded.length; i += 2) {
    leaves.push({
      front: padded[i],
      frontIndex: i,
      back: padded[i + 1] || { type: 'blank' },
      backIndex: i + 1 < padded.length ? i + 1 : -1
    });
  }
  return leaves;
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
  document.body.style.overflow = '';
  viewerBook = null;
  viewerLeaves = [];
  viewerLeafIndex = 0;
  _isAnimating = false;
  if (_activeKeydownHandler) {
    document.removeEventListener('keydown', _activeKeydownHandler);
    _activeKeydownHandler = null;
  }
}

function renderViewer() {
  const b = viewerBook;
  const d = { ...(b.design || defaultDesign()) };
  d.direction = detectBookDirection(b);
  const totalLeaves = viewerLeaves.length;

  const pageBaseStyle = `
    background-color:${d.pageColor};
    color:${d.textColor};
    font-family:'${d.fontFamily}',sans-serif;
    font-size:${d.fontSize}px;
    line-height:${d.lineHeight};
    direction:${d.direction};
  `;

  const paperClass = d.paperStyle !== 'plain' ? d.paperStyle : '';

  const leavesHtml = viewerLeaves.map((leaf, i) => {
    const frontHtml = renderViewerPage(leaf.front, leaf.frontIndex, d, paperClass, pageBaseStyle, 'front');
    const backHtml = renderViewerPage(leaf.back, leaf.backIndex, d, paperClass, pageBaseStyle, 'back');

    return `
      <div class="leaf" data-index="${i}">
        <div class="face front">${frontHtml}</div>
        <div class="face back">${backHtml}</div>
      </div>`;
  }).join('');

  document.getElementById('modalContent').innerHTML = `
    <div class="modal-header">
      <h3>📖 ${escapeHtml(b.title)} <span style="font-size:12px;color:var(--muted);font-weight:400">(${d.direction === 'rtl' ? 'عربي — يفتح من اليمين' : 'English — opens from left'})</span></h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>

    <div class="book-viewer ${isMobile ? 'mobile-mode' : ''}">
      <div class="flipbook closed" data-dir="${d.direction}" id="flipbookEl">
        <div class="flipbook-bg"></div>
        ${leavesHtml}
      </div>
    </div>

    <div class="page-indicator"><span id="pageInfo"></span></div>

    <div class="viewer-controls">
      <button class="btn btn-outline" onclick="prevLeaf()" id="prevBtn" disabled>← السابق</button>
      <button class="btn btn-primary" onclick="nextLeaf()" id="nextBtn">📖 فتح الكتاب →</button>
    </div>

    <div style="display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap">
      <button class="btn btn-success" onclick="exportPDF('${b.id}')">📄 تصدير PDF</button>
    </div>

    ${d.footerText ? `<div style="text-align:center;font-size:11px;color:#aaa;margin-top:16px">${escapeHtml(d.footerText)}</div>` : ''}`;

  updateLeavesState();
  attachCoverClickHandler();

  _activeKeydownHandler = (e) => {
    if (!document.getElementById('modal').classList.contains('active')) return;
    const isRTL = d.direction === 'rtl';
    if (e.key === 'ArrowLeft') isRTL ? nextLeaf() : prevLeaf();
    else if (e.key === 'ArrowRight') isRTL ? prevLeaf() : nextLeaf();
    else if (e.key === 'Escape') closeModal();
  };
  document.addEventListener('keydown', _activeKeydownHandler);
}

function attachCoverClickHandler() {
  const flipbook = document.getElementById('flipbookEl');
  if (!flipbook) return;
  const coverLeaf = flipbook.querySelector('.leaf[data-index="0"]');
  if (coverLeaf) {
    coverLeaf.addEventListener('click', (e) => {
      if (flipbook.classList.contains('closed') && !_isAnimating) {
        e.stopPropagation();
        openBook();
      }
    });
  }
}

function openBook() {
  const flipbook = document.getElementById('flipbookEl');
  if (!flipbook || !flipbook.classList.contains('closed')) return;
  if (_isAnimating) return;
  _isAnimating = true;

  flipbook.classList.remove('closed');
  applyZIndexes();

  setTimeout(() => {
    if (viewerLeafIndex < viewerLeaves.length) {
      viewerLeafIndex++;
      updateLeavesState();
    }
    _isAnimating = false;
  }, 1050);
}

function renderViewerPage(page, pageIndex, d, paperClass, baseStyle, side) {

        <div style="width:80px;height:2px;background:#d4a373;margin:0 auto 24px"></div>

        <img src="${page.cover}" style="width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.55)">
        <div style="position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.2) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:40px;color:white">
          <h2 style="font-family:'Amiri',serif;font-size:1.8em;margin-bottom:12px;color:#d4a373">${escapeHtml(page.title)}</h2>
          ${page.author ? `<p style="font-size:1em;opacity:0.9;margin-bottom:20px;letter-spacing:1px">${escapeHtml(page.author)}</p>` : ''}
          ${page.description ? `<p style="font-size:0.9em;line-height:1.8;opacity:0.95;margin-top:20px;border-top:1px solid rgba(212,163,115,0.4);padding-top:20px">${escapeHtml(page.description)}</p>` : ''}
        </div>
      </div>`;
    }
    return `<div class="page-content cover-full" style="padding:0;position:relative;background:linear-gradient(135deg,#5c3d1f,#8b5e34);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white">
      <div style="position:absolute;inset:20px;border:2px solid rgba(212,163,115,0.6);border-radius:8px;pointer-events:none"></div>
      <div style="padding:60px 40px;position:relative;z-index:1">
        <h2 style="font-family:'Amiri',serif;font-size:1.8em;margin-bottom:20px;color:#d4a373">${escapeHtml(page.title)}</h2>
        ${page.author ? `<p style="font-size:1em;opacity:0.8;margin-bottom:30px">${escapeHtml(page.author)}</p>` : ''}
        ${page.description ? `<p style="font-size:0.9em;line-height:1.8;opacity:0.85;border-top:1px solid rgba(212,163,115,0.4);padding-top:20px">${escapeHtml(page.description)}</p>` : ''}
        <div style="margin-top:40px;font-size:24px;opacity:0.5">✦ ✦ ✦</div>
      </div>
    </div>`;
  }

      <h1 style="font-size:2em;margin-bottom:20px">${escapeHtml(page.title)}</h1>

      <div style="font-size:48px;margin-bottom:20px;opacity:0.5">✦</div>
      <h2 style="font-family:'Amiri',serif;font-size:1.5em;margin-bottom:16px;opacity:0.7">النهاية</h2>
      <p style="font-size:0.9em;opacity:0.5;line-height:1.8;max-width:80%">شكراً لقراءتك "${escapeHtml(page.title)}"</p>

function nextLeaf() {
  if (_isAnimating) return;
  const flipbook = document.getElementById('flipbookEl');

  if (flipbook && flipbook.classList.contains('closed')) {
    openBook();
    return;
  }

  if (viewerLeafIndex < viewerLeaves.length) {
    viewerLeafIndex++;
    updateLeavesState();
  }
}

function prevLeaf() {
  if (_isAnimating) return;
  const flipbook = document.getElementById('flipbookEl');

  if (viewerLeafIndex === 1 && flipbook) {
    viewerLeafIndex = 0;
    updateLeavesState();
    _isAnimating = true;
    setTimeout(() => {
      flipbook.classList.add('closed');
      updateLeavesState();
      _isAnimating = false;
    }, 500);
    return;
  }

  if (viewerLeafIndex > 0) {
    viewerLeafIndex--;
    updateLeavesState();
  }
}

function updateLeavesState() {
  const d = viewerBook?.design || {};
  const isRTL = d.direction === 'rtl';
  const totalLeaves = viewerLeaves.length;
  const flipbook = document.getElementById('flipbookEl');
  const isClosed = flipbook && flipbook.classList.contains('closed');

  document.querySelectorAll('.leaf').forEach(leaf => {
    const i = parseInt(leaf.dataset.index);
    const isFlipped = i < viewerLeafIndex;
    leaf.classList.toggle('flipped', isFlipped);
  });

  applyZIndexes();

  const infoEl = document.getElementById('pageInfo');
  if (infoEl) {
    if (isClosed || viewerLeafIndex === 0) {
      infoEl.textContent = '📕 الكتاب مقفول — اضغط على الغلاف لفتحه';
    } else if (viewerLeafIndex >= totalLeaves) {
      infoEl.textContent = '📕 الغلاف الخلفي — الكتاب مغلق';
    } else {
      const leftLeaf = viewerLeaves[viewerLeafIndex - 1];
      const rightLeaf = viewerLeaves[viewerLeafIndex];
      const leftIdx = leftLeaf ? leftLeaf.backIndex : -1;
      const rightIdx = rightLeaf ? rightLeaf.frontIndex : -1;
      const parts = [];
      if (isRTL) {
        if (rightIdx >= 0) parts.push(`صفحة ${rightIdx + 1}`);
        if (leftIdx >= 0) parts.push(`صفحة ${leftIdx + 1}`);
      } else {
        if (leftIdx >= 0) parts.push(`صفحة ${leftIdx + 1}`);
        if (rightIdx >= 0) parts.push(`صفحة ${rightIdx + 1}`);
      }
      infoEl.textContent = `📄 ${parts.join(' — ')}`;
    }
  }

  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  if (prevBtn) {
    prevBtn.disabled = (viewerLeafIndex === 0 && !isClosed) || _isAnimating;
  }
  if (nextBtn) {
    nextBtn.disabled = viewerLeafIndex >= totalLeaves || _isAnimating;
    if (isClosed || viewerLeafIndex === 0) {
      nextBtn.textContent = '📖 فتح الكتاب →';
    } else if (viewerLeafIndex >= totalLeaves) {
      nextBtn.textContent = 'انتهى الكتاب';
    } else {
      nextBtn.textContent = 'التالي →';
    }
  }
}

function applyZIndexes() {
  const d = viewerBook?.design || {};
  const isRTL = d.direction === 'rtl';
  const totalLeaves = viewerLeaves.length;
  const flipbook = document.getElementById('flipbookEl');
  const isClosed = flipbook && flipbook.classList.contains('closed');

  document.querySelectorAll('.leaf').forEach(leaf => {
    const i = parseInt(leaf.dataset.index);
    const isFlipped = i < viewerLeafIndex;

    if (isClosed) {
      leaf.style.zIndex = i === 0 ? 999 : 1;
      return;
    }

    if (isRTL) {
      leaf.style.zIndex = isFlipped ? (i + 1) : (totalLeaves - i);
    } else {
      leaf.style.zIndex = isFlipped ? (totalLeaves - i) : (i + 1);
    }
  });
}

/* ============================================================
   📄 PDF EXPORT
   ============================================================ */
async function waitForFonts() {
  if (!document.fonts) return;
  try {
    await Promise.all([
      document.fonts.load('16px Amiri'),
      document.fonts.load('16px Cairo'),
      document.fonts.load('16px Tajawal'),
      document.fonts.load('16px Scheherazade New'),
      document.fonts.load('bold 16px Amiri'),
      document.fonts.load('bold 16px Cairo')
    ]);
    await document.fonts.ready;
  } catch (e) {
    console.warn('Font loading issue:', e);
  }
}

function safeFileName(name) {
  const cleaned = (name || 'book').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '_').trim();
  if (/[\u0600-\u06FF]/.test(cleaned)) return 'kitab_' + Date.now() + '.pdf';
  return (cleaned || 'book') + '.pdf';
}

function showPDFProgress(text = 'جاري التصدير...') {
  let el = document.getElementById('pdfProgress');
  if (!el) {
    el = document.createElement('div');
    el.id = 'pdfProgress';
    el.className = 'pdf-progress-overlay';
    el.innerHTML = `<div class="pdf-progress-spinner"></div><div id="pdfProgressText" class="pdf-progress-text">${text}</div>`;
    document.body.appendChild(el);
  } else {
    el.style.display = 'flex';
    document.getElementById('pdfProgressText').textContent = text;
  }
}
function updatePDFProgress(text) {
  const el = document.getElementById('pdfProgressText');
  if (el) el.textContent = text;
}
function hidePDFProgress() {
  const el = document.getElementById('pdfProgress');
  if (el) el.remove();
}

async function exportPDF(id) {
  const b = getBook(id);
  if (!b) return;

  const d = { ...(b.design || defaultDesign()) };
  d.direction = detectBookDirection(b);
  const pages = buildPages(b);

  if (!pages || pages.length === 0) {
    toast('لا يوجد محتوى للتصدير', 'error');
    return;
  }

  showPDFProgress('جاري تحضير الخطوط...');

  try {
    await waitForFonts();
    updatePDFProgress('جاري بناء الصفحات...');

    const dims = PAGE_DIMENSIONS[d.pageSize] || PAGE_DIMENSIONS['A5'];
    const widthMm = dims.width;
    const heightMm = dims.height;
    const pxW = Math.round(widthMm * MM_TO_PX);
    const pxH = Math.round(heightMm * MM_TO_PX);

    const stage = document.createElement('div');
    stage.style.cssText = `
      position: fixed;
      top: 0;
      left: 0;
      width: ${pxW}px;
      height: ${pxH}px;
      z-index: -9999;
      opacity: 0.01;
      pointer-events: none;
      overflow: hidden;
    `;
    document.body.appendChild(stage);

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
      unit: 'mm',
      format: [widthMm, heightMm],
      orientation: 'portrait',
      compress: true
    });

    const total = pages.length;
    const bgColor = d.paperStyle === 'vintage' ? '#f5ecd7' : d.pageColor;

    for (let i = 0; i < total; i++) {
      updatePDFProgress(`جاري تصدير الصفحة ${i + 1} من ${total}...`);

      const pageEl = document.createElement('div');
      pageEl.style.cssText = `
        width: ${pxW}px;
        height: ${pxH}px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        background-color: ${bgColor};
        color: ${d.textColor};
        font-family: '${d.fontFamily}', 'Amiri', sans-serif;
        font-size: ${d.fontSize}px;
        line-height: ${d.lineHeight};
        direction: ${d.direction};
        text-align: ${d.direction === 'rtl' ? 'right' : 'left'};
      `;

      if (d.paperStyle === 'lined') {
        const linePx = d.lineHeight * d.fontSize;
        pageEl.style.backgroundImage = `repeating-linear-gradient(transparent, transparent ${linePx - 1}px, #e5e7eb ${linePx}px)`;
      } else if (d.paperStyle === 'dotted') {
        pageEl.style.backgroundImage = 'radial-gradient(#cbd5e1 1px, transparent 1px)';
        pageEl.style.backgroundSize = '20px 20px';
      }

      pageEl.innerHTML = buildPDFPageHTML(pages[i], d, i);
      stage.innerHTML = '';
      stage.appendChild(pageEl);

      await new Promise(r => setTimeout(r, 60));

      const canvas = await html2canvas(pageEl, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: bgColor,
        logging: false,
        width: pxW,
        height: pxH,
        windowWidth: pxW,
        windowHeight: pxH
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.92);

      if (i > 0) pdf.addPage([widthMm, heightMm], 'portrait');
      pdf.addImage(imgData, 'JPEG', 0, 0, widthMm, heightMm, undefined, 'FAST');
    }

    document.body.removeChild(stage);

    const fileName = safeFileName(b.title);
    pdf.save(fileName);

    hidePDFProgress();
    toast('تم تصدير PDF بنجاح ✅', 'success');
  } catch (err) {
    console.error('PDF Export Error:', err);
    hidePDFProgress();
    document.querySelectorAll('div[style*="-9999"]').forEach(el => el.remove());
    toast('فشل التصدير: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

function buildPDFPageHTML(p, d, pageIndex) {
  const pad = d.margin;
  const align = d.direction === 'rtl' ? 'right' : 'left';

  if (p.type === 'frontCover') {
    if (p.cover) {
      return `<img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;display:block" crossorigin="anonymous">`;
    }
    return `<div style="width:100%;height:100%;background:linear-gradient(135deg,#8b5e34,#5c3d1f);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;position:relative;box-sizing:border-box;padding:60px">
      <div style="position:absolute;inset:20px;border:2px solid rgba(212,163,115,0.6);border-radius:8px;"></div>
      <h1 style="font-family:'Amiri',serif;font-size:2.3em;color:#d4a373;margin:0 0 24px 0;text-shadow:0 2px 10px rgba(0,0,0,0.4)">${escapeHtml(p.title)}</h1>
      <div style="width:80px;height:2px;background:#d4a373;margin-bottom:24px"></div>
      ${p.author ? `<p style="font-size:1.2em;opacity:0.9;margin:0">${escapeHtml(p.author)}</p>` : ''}
    </div>`;
  }

  if (p.type === 'backCover') {
    if (p.cover) {
      return `<div style="width:100%;height:100%;position:relative;overflow:hidden">
        <img src="${p.cover}" style="width:100%;height:100%;object-fit:cover;display:block;filter:brightness(0.55)" crossorigin="anonymous">
        <div style="position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.92),transparent);display:flex;flex-direction:column;justify-content:flex-end;padding:40px;color:white;box-sizing:border-box">
          <h2 style="font-family:'Amiri',serif;font-size:1.8em;color:#d4a373;margin:0 0 16px 0">${escapeHtml(p.title)}</h2>
          ${p.author ? `<p style="opacity:0.9;margin:0 0 20px 0">${escapeHtml(p.author)}</p>` : ''}
          ${p.description ? `<p style="font-size:0.9em;line-height:1.8;border-top:1px solid rgba(212,163,115,0.4);padding-top:20px;margin:0">${escapeHtml(p.description)}</p>` : ''}
        </div>
      </div>`;
    }
    return `<div style="width:100%;height:100%;background:linear-gradient(135deg,#5c3d1f,#8b5e34);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:white;padding:60px;box-sizing:border-box;position:relative">
      <div style="position:absolute;inset:20px;border:2px solid rgba(212,163,115,0.6);border-radius:8px;"></div>
      <h2 style="font-family:'Amiri',serif;font-size:1.8em;color:#d4a373;margin:0 0 20px 0">${escapeHtml(p.title)}</h2>
      ${p.author ? `<p style="font-size:1em;opacity:0.8;margin:0 0 30px 0">${escapeHtml(p.author)}</p>` : ''}
      ${p.description ? `<p style="font-size:0.9em;line-height:1.8;opacity:0.85;border-top:1px solid rgba(212,163,115,0.4);padding-top:20px;margin:0">${escapeHtml(p.description)}</p>` : ''}
    </div>`;
  }

  if (p.type === 'title') {
    return `<div style="width:100%;height:100%;padding:${pad}px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
      <h1 style="font-size:2em;margin:0 0 20px 0">${escapeHtml(p.title)}</h1>
      ${p.author ? `<p style="font-size:1.2em;opacity:0.7;margin:0 0 16px 0">${escapeHtml(p.author)}</p>` : ''}
      ${p.category ? `<p style="opacity:0.5;margin:0">${escapeHtml(p.category)}</p>` : ''}
    </div>`;
  }

  if (p.type === 'endPage') {
    return `<div style="width:100%;height:100%;padding:${pad}px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center">
      <div style="font-size:48px;opacity:0.5;margin-bottom:20px">✦</div>
      <h2 style="font-family:'Amiri',serif;font-size:1.5em;opacity:0.7;margin:0 0 16px 0">النهاية</h2>
      <p style="font-size:0.9em;opacity:0.5;line-height:1.8;margin:0">شكراً لقراءتك "${escapeHtml(p.title)}"</p>
    </div>`;
  }

  if (p.type === 'blank') {
    return `<div style="width:100%;height:100%"></div>`;
  }

  return `<div style="width:100%;height:100%;padding:${pad}px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;text-align:${align}">
    ${d.headerText ? `<div style="font-size:11px;color:#999;text-align:center;padding-bottom:8px;flex-shrink:0">${escapeHtml(d.headerText)}</div>` : ''}
    <div style="flex:1;overflow:hidden;min-height:0">
      ${p.chapterTitle ? `<h2 style="margin:0 0 14px 0;font-size:1.4em;font-family:'${d.fontFamily}',serif">${escapeHtml(p.chapterTitle)}</h2>` : ''}
      <div style="white-space:pre-wrap;overflow-wrap:break-word;margin:0">${escapeHtml(p.content) || ''}</div>
    </div>
    ${d.footerText ? `<div style="font-size:11px;color:#aaa;text-align:center;border-top:1px solid #eee;padding-top:8px;flex-shrink:0">${escapeHtml(d.footerText)}</div>` : ''}
    ${d.showPageNumbers && pageIndex >= 0 ? `<div style="position:absolute;bottom:${Math.max(8, pad/4)}px;${d.direction === 'rtl' ? 'left' : 'right'}:${pad}px;font-size:11px;color:#999">${pageIndex + 1}</div>` : ''}
  </div>`;
}

/* ============================================================
   📱 RESPONSIVE
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const wasMobile = isMobile;
    isMobile = window.innerWidth <= 768;
    if (wasMobile !== isMobile) {
      if (currentEditingId) renderEditor();
      else renderLibrary();
    }
  }, 200);
});

/* ============================================================
   👆 SWIPE
   ============================================================ */
let touchStartX = 0, touchStartY = 0, touchActive = false;
document.addEventListener('touchstart', e => {
  const modal = document.getElementById('modal');
  if (!modal.classList.contains('active')) return;
  if (e.touches.length !== 1) return;
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchActive = true;
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!touchActive) return;
  touchActive = false;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
    const isRTL = (viewerBook?.design?.direction === 'rtl');
    if (isRTL) {
      if (dx < 0) nextLeaf();
      else prevLeaf();
    } else {
      if (dx > 0) nextLeaf();
      else prevLeaf();
    }
  }
}, { passive: true });

document.addEventListener('touchcancel', () => { touchActive = false; }, { passive: true });

/* ============================================================
   🚀 INIT
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  isMobile = window.innerWidth <= 768;
  seedDefaultBook();
  renderLibrary();
});
</script>
