<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
<meta name="theme-color" content="#5c3d1f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="كتابي" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<title>كتابي — نظام إنشاء الكتب</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.1.0/build/index.umd.js"></script>

<style>
  /* ============================================================
     🎨 ROOT & RESET
     ============================================================ */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  :root {
    --primary: #8b5e34;
    --primary-dark: #5c3d1f;
    --primary-light: #b8895a;
    --accent: #d4a373;
    --bg: #f5f0e8;
    --card: #ffffff;
    --text: #2d2416;
    --muted: #8a7a68;
    --border: #e0d5c2;
    --danger: #c0392b;
    --success: #27ae60;
    --info: #3498db;
    --warning: #f39c12;

    --nav-h: 56px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);

    --shadow-sm: 0 2px 8px rgba(139,94,52,0.08);
    --shadow-md: 0 4px 16px rgba(139,94,52,0.12);
    --shadow-lg: 0 10px 40px rgba(139,94,52,0.18);

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 18px;

    /* Fluid typography */
    --fs-xs: clamp(10px, 2.5vw, 12px);
    --fs-sm: clamp(12px, 3vw, 14px);
    --fs-md: clamp(14px, 3.5vw, 16px);
    --fs-lg: clamp(16px, 4vw, 20px);
    --fs-xl: clamp(18px, 5vw, 24px);
  }

  body.dark-mode {
    --primary: #d4a373;
    --primary-dark: #f0d5b0;
    --primary-light: #b8895a;
    --accent: #d4a373;
    --bg: #121212;
    --card: #1e1e1e;
    --text: #e8e8e8;
    --muted: #999;
    --border: #333;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.6);
  }

  html {
    -webkit-text-size-adjust: 100%;
    scroll-behavior: smooth;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    transition: background 0.3s, color 0.3s;
    padding-left: var(--safe-left);
    padding-right: var(--safe-right);
  }

  /* ============================================================
     🧭 NAVBAR
     ============================================================ */
  .navbar {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    padding: 8px 12px;
    padding-top: calc(8px + var(--safe-top));
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: var(--nav-h);
    gap: 6px;
  }
  .navbar h1 {
    font-size: var(--fs-md);
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 900;
    flex-shrink: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .navbar h1 span { font-size: 1.2em; }
  .navbar h1 small {
    font-size: 0.65em;
    opacity: 0.7;
    margin-right: 2px;
    font-weight: 400;
  }
  .nav-actions { display: flex; gap: 4px; flex-shrink: 0; }

  /* ============================================================
     🔘 BUTTONS
     ============================================================ */
  .btn {
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: var(--fs-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: transform 0.1s ease, background 0.2s ease, opacity 0.2s;
    min-height: 44px;
    user-select: none;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.95); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--primary-dark); }
  .btn-light { background: rgba(255,255,255,0.22); color: white; }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-info { background: var(--info); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-sm { padding: 8px 12px; font-size: var(--fs-xs); min-height: 38px; }
  .btn-xs { padding: 6px 10px; font-size: var(--fs-xs); min-height: 34px; border-radius: 8px; }
  .btn-icon {
    padding: 8px;
    width: 42px;
    height: 42px;
    min-height: 42px;
    font-size: 18px;
    flex-shrink: 0;
  }

  /* ============================================================
     📦 CONTAINER
     ============================================================ */
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: calc(90px + var(--safe-bottom));
    width: 100%;
    flex: 1;
  }

  /* ============================================================
     📚 LIBRARY
     ============================================================ */
  .library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    gap: 8px;
  }
  .library-header h2 {
    font-size: var(--fs-lg);
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .library-header p {
    color: var(--muted);
    font-size: var(--fs-xs);
    margin-top: 2px;
  }

  .library-toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .library-toolbar input[type="text"] {
    flex: 1;
    min-width: 140px;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: var(--fs-md);
    background: var(--card);
    color: var(--text);
    min-height: 46px;
  }
  .library-toolbar input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,163,115,0.15);
  }
  .library-toolbar select {
    padding: 12px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: var(--fs-sm);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
    min-height: 46px;
    flex-shrink: 0;
  }

  /* ============================================================
     📖 BOOKS GRID — تخطيط مرن لكل الشاشات
     ============================================================ */
  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(160px, 45%), 1fr));
    gap: 12px;
  }

  @media (max-width: 340px) {
    .books-grid {
      grid-template-columns: 1fr;
      gap: 10px;
    }
  }

  .book-card {
    background: var(--card);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .book-card:active { transform: scale(0.97); }

  .book-favorite {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(255,255,255,0.95);
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .book-favorite:active { transform: scale(0.9); }

  .book-cover {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: clamp(28px, 10vw, 48px);
    font-family: 'Amiri', serif;
    position: relative;
    overflow: hidden;
  }
  .book-cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.15), transparent 15%, transparent 85%, rgba(0,0,0,0.15));
    pointer-events: none;
  }

  .book-info {
    padding: 8px 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .book-info h3 {
    font-size: var(--fs-sm);
    color: var(--primary-dark);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 700;
  }
  .book-info .author {
    font-size: var(--fs-xs);
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-info .meta {
    font-size: 10px;
    color: var(--muted);
    margin-top: auto;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .book-info .meta span {
    background: rgba(139,94,52,0.08);
    padding: 2px 6px;
    border-radius: 6px;
  }

  .card-actions {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: rgba(0,0,0,0.03);
    border-top: 1px solid var(--border);
  }
  .card-actions .btn {
    flex: 1;
    padding: 6px 2px;
    font-size: 14px;
    min-height: 36px;
  }

  /* ============================================================
     🎯 EMPTY STATE
     ============================================================ */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty-state .icon {
    font-size: clamp(48px, 15vw, 80px);
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .empty-state h3 {
    font-size: var(--fs-lg);
    margin-bottom: 8px;
    color: var(--primary-dark);
  }
  .empty-state p {
    margin-bottom: 20px;
    font-size: var(--fs-sm);
  }

  /* ============================================================
     ✏️ EDITOR
     ============================================================ */
  .editor-layout {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 14px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }
  .panel h3 {
    color: var(--primary-dark);
    font-size: var(--fs-md);
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ============================================================
     📑 TABS — قابلة للتمرير أفقيًا
     ============================================================ */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: rgba(139,94,52,0.06);
    padding: 4px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 80px;
    padding: 10px 6px;
    text-align: center;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: var(--fs-xs);
    color: var(--muted);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    white-space: nowrap;
    transition: all 0.2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active {
    background: var(--card);
    color: var(--primary-dark);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  /* ============================================================
     📝 FORMS
     ============================================================ */
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: var(--fs-xs);
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }
  .form-group input[type="text"],
  .form-group input[type="number"],
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 16px;
    background: var(--card);
    color: var(--text);
    min-height: 48px;
    transition: border 0.2s;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 140px;
    line-height: 1.7;
    font-size: 15px;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,163,115,0.15);
  }

  input[type="color"] {
    width: 100%;
    height: 48px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    padding: 4px;
    background: var(--card);
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--primary);
    height: 36px;
  }
  input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: var(--primary);
    vertical-align: middle;
    margin-left: 6px;
  }

  /* ============================================================
     📄 CHAPTERS
     ============================================================ */
  .chapter-item {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s, opacity 0.2s, transform 0.2s;
  }
  .chapter-item.dragging { opacity: 0.4; transform: scale(0.97); }
  .chapter-item.drag-over { border-color: var(--accent); border-style: dashed; }
  .chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px;
    background: rgba(139,94,52,0.06);
    cursor: pointer;
    font-weight: 600;
    font-size: var(--fs-sm);
    color: var(--primary-dark);
    min-height: 52px;
    gap: 6px;
  }
  .chapter-header .ch-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
  }
  .chapter-header .drag-handle {
    cursor: grab;
    color: var(--muted);
    padding: 0 4px;
    user-select: none;
    font-size: 16px;
    touch-action: none;
  }
  .chapter-body {
    padding: 12px;
    display: none;
  }
  .chapter-item.open .chapter-body { display: block; }

  /* ============================================================
     📊 STATS
     ============================================================ */
  .stats-box {
    background: linear-gradient(135deg, rgba(139,94,52,0.08), rgba(212,163,115,0.05));
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
    margin-bottom: 14px;
  }
  .stats-box h4 {
    font-size: var(--fs-sm);
    color: var(--primary-dark);
    margin-bottom: 10px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .stat-item {
    background: var(--card);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: var(--fs-xs);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .stat-item span:first-child {
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .stat-item span:last-child {
    color: var(--primary-dark);
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ============================================================
     🎨 COVER PREVIEW
     ============================================================ */
  .cover-preview {
    width: 100%;
    aspect-ratio: 3/4;
    max-height: 240px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: var(--fs-sm);
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
    background: rgba(139,94,52,0.03);
    transition: all 0.2s;
    text-align: center;
    padding: 16px;
  }
  .cover-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* ============================================================
     📱 MOBILE BOTTOM BAR
     ============================================================ */
  .mobile-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 2px solid var(--border);
    padding: 8px 10px;
    padding-bottom: calc(8px + var(--safe-bottom));
    display: flex;
    gap: 6px;
    z-index: 95;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  }
  .mobile-bottom-bar .btn {
    flex: 1;
    font-size: var(--fs-xs);
    padding: 8px 4px;
    min-height: 48px;
    flex-direction: column;
    gap: 2px;
  }
  .mobile-bottom-bar .btn .icon { font-size: 18px; }

  /* ============================================================
     🎈 FAB
     ============================================================ */
  .fab {
    position: fixed;
    bottom: calc(90px + var(--safe-bottom));
    left: 16px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(139,94,52,0.4);
    cursor: pointer;
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.9); }

  /* ============================================================
     🪟 MODAL
     ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 0;
    overflow: hidden;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: var(--card);
    border-radius: 0;
    max-width: 100%;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    padding: 12px;
    padding-top: calc(12px + var(--safe-top));
    padding-bottom: calc(12px + var(--safe-bottom));
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    gap: 10px;
    position: sticky;
    top: 0;
    background: var(--card);
    z-index: 10;
    padding-top: 4px;
  }
  .modal-header h3 {
    color: var(--primary-dark);
    font-size: var(--fs-md);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .close-btn {
    background: rgba(0,0,0,0.05);
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: var(--muted);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .close-btn:active { background: rgba(0,0,0,0.15); transform: scale(0.9); }

  /* ============================================================
     📖 BOOK VIEWER
     ============================================================ */
  .book-viewer {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 10px 0;
    perspective: 3000px;
  }

  .flipbook {
    position: relative;
    width: 100%;
    max-width: 400px;
    height: 70vh;
    height: 70dvh;
    min-height: 400px;
    max-height: 620px;
    margin: 0 auto;
    transform-style: preserve-3d;
    perspective: 2500px;
    transition: transform 0.5s ease;
  }

  .flipbook .leaf {
    position: absolute;
    top: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1),
                opacity 0.5s ease;
    cursor: pointer;
    will-change: transform;
  }

  .flipbook[data-dir="rtl"] .leaf {
    right: 0;
    left: auto;
    transform-origin: right center;
    transform: rotateY(0deg);
  }
  .flipbook[data-dir="rtl"] .leaf.flipped {
    transform: rotateY(180deg);
  }

  .flipbook[data-dir="ltr"] .leaf {
    left: 0;
    right: auto;
    transform-origin: left center;
    transform: rotateY(0deg);
  }
  .flipbook[data-dir="ltr"] .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .flipbook .leaf .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
    border-radius: 6px;
  }

  .flipbook[data-dir="rtl"] .leaf .face.back {
    transform: rotateY(180deg);
  }
  .flipbook[data-dir="ltr"] .leaf .face.back {
    transform: rotateY(-180deg);
  }

  .flipbook .leaf .page-content {
    flex: 1;
    padding: 20px;
    overflow: hidden;
    line-height: 1.9;
    overflow-wrap: break-word;
    word-wrap: break-word;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-sizing: border-box;
  }

  .flipbook .leaf .page-header {
    font-size: 10px;
    color: #999;
    text-align: center;
    padding: 0 0 8px;
    flex-shrink: 0;
  }

  .flipbook .leaf .page-footer {
    font-size: 10px;
    color: #aaa;
    text-align: center;
    padding: 8px 0 0;
    border-top: 1px solid #eee;
    flex-shrink: 0;
  }

  .flipbook .leaf .page-num {
    position: absolute;
    bottom: 10px;
    font-size: 11px;
    color: #999;
    pointer-events: none;
  }
  .flipbook[data-dir="rtl"] .leaf .face.front .page-num { right: 16px; }
  .flipbook[data-dir="rtl"] .leaf .face.back .page-num { left: 16px; }
  .flipbook[data-dir="ltr"] .leaf .face.front .page-num { left: 16px; }
  .flipbook[data-dir="ltr"] .leaf .face.back .page-num { right: 16px; }

  .flipbook.closed .leaf:not([data-index="0"]) {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }
  .flipbook.closed .leaf[data-index="0"] {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .cover-full {
    position: absolute !important;
    inset: 0;
    padding: 0 !important;
    margin: 0 !important;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
  }
  .cover-full img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ============================================================
     🎮 VIEWER CONTROLS
     ============================================================ */
  .viewer-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  .viewer-controls .btn {
    min-width: 80px;
    flex: 1;
    max-width: 130px;
  }

  .page-indicator {
    font-size: var(--fs-xs);
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
    font-weight: 600;
    min-height: 18px;
    padding: 0 8px;
  }

  /* ============================================================
     👁️ PREVIEW (SPREAD) — تخطيط عمودي للجوال
     ============================================================ */
  .preview-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding: 8px;
    background: rgba(139,94,52,0.06);
    border-radius: var(--radius-sm);
  }
  .preview-indicator {
    font-size: var(--fs-sm);
    font-weight: 700;
    color: var(--primary-dark);
    min-width: 60px;
    text-align: center;
  }

  .preview-spread-container {
    perspective: 2000px;
  }
  .preview-spread {
    gap: 8px;
    justify-content: center;
    align-items: stretch;
    animation: fadeIn 0.3s ease;
    flex-direction: column;
  }
  .preview-spread-page {
    flex: 1;
    background: white;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    overflow: hidden;
    border-radius: 6px;
    min-height: 350px;
    position: relative;
  }

  .preview-page {
    background: var(--card);
    padding: 20px;
    border-radius: 6px;
    box-shadow: var(--shadow-md);
    margin-bottom: 12px;
    min-height: 300px;
    position: relative;
    line-height: 1.8;
    overflow-wrap: break-word;
  }
  .preview-page.lined {
    background-image: repeating-linear-gradient(transparent, transparent 33px, #e5e7eb 34px);
    background-position: 0 24px;
  }
  .preview-page.dotted {
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .preview-page.vintage { background: #f5ecd7; }

  .preview-header, .preview-footer {
    font-size: 11px;
    color: #888;
    text-align: center;
    padding: 6px 0;
  }
  .preview-footer {
    border-top: 1px solid #eee;
    margin-top: 16px;
  }

  /* ============================================================
     💾 PDF PROGRESS
     ============================================================ */
  .pdf-progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 3000;
    color: white;
    font-family: 'Cairo', sans-serif;
    gap: 20px;
    padding: 20px;
  }
  .pdf-progress-spinner {
    width: 60px;
    height: 60px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: pdfspin 1s linear infinite;
  }
  @keyframes pdfspin { to { transform: rotate(360deg); } }
  .pdf-progress-text {
    font-size: var(--fs-md);
    font-weight: 600;
    text-align: center;
    padding: 0 12px;
  }

  /* ============================================================
     🔖 BOOKMARKS
     ============================================================ */
  .bookmarks-panel {
    max-height: 260px;
    overflow-y: auto;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    background: rgba(139,94,52,0.03);
    -webkit-overflow-scrolling: touch;
  }
  .bookmark-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--card);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: var(--fs-xs);
    gap: 8px;
  }
  .bookmark-item .bm-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ============================================================
     🍞 TOAST
     ============================================================ */
  .toast {
    position: fixed;
    bottom: calc(100px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(140px);
    background: var(--primary-dark);
    color: white;
    padding: 12px 22px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: var(--fs-sm);
    z-index: 2000;
    transition: transform 0.3s ease;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    max-width: calc(100vw - 32px);
    text-align: center;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warning { background: var(--warning); }

  /* ============================================================
     🔻 FOOTER
     ============================================================ */
  .site-footer {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    text-align: center;
    padding: 14px 12px;
    padding-bottom: calc(14px + var(--safe-bottom));
    font-size: var(--fs-xs);
    margin-top: auto;
  }
  .site-footer strong { color: var(--accent); font-weight: 700; }

  /* ============================================================
     🛠️ UTILITIES
     ============================================================ */
  .hidden { display: none !important; }

  .measure-info {
    background: rgba(39,174,96,0.1);
    border: 1.5px solid var(--success);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: var(--fs-xs);
    color: var(--success);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* ============================================================
     📱 RESPONSIVE BREAKPOINTS
     ============================================================ */

  /* شاشات صغيرة جداً (iPhone SE / 320px) */
  @media (max-width: 360px) {
    :root {
      --nav-h: 52px;
    }
    .navbar { padding: 6px 10px; padding-top: calc(6px + var(--safe-top)); }
    .navbar h1 { font-size: 14px; }
    .navbar h1 span { font-size: 16px; }
    .btn-icon { width: 38px; height: 38px; min-height: 38px; font-size: 16px; }
    .container { padding: 10px; padding-bottom: calc(90px + var(--safe-bottom)); }
    .panel { padding: 12px; }
    .book-info h3 { font-size: 12px; }
    .book-info .meta { font-size: 9px; }
    .mobile-bottom-bar .btn { font-size: 10px; min-height: 46px; }
    .flipbook { height: 65vh; height: 65dvh; min-height: 350px; }
  }

  /* شاشات متوسطة (iPhone 12/13/14 — 390-430px) */
  @media (min-width: 361px) and (max-width: 480px) {
    .books-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .flipbook { height: 72vh; height: 72dvh; }
  }

  /* شاشات كبيرة (Plus / Pro Max — 428-480px) */
  @media (min-width: 481px) and (max-width: 640px) {
    .books-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    .flipbook { max-width: 480px; height: 74vh; height: 74dvh; }
  }

  /* أجهزة لوحية صغيرة */
  @media (min-width: 641px) and (max-width: 900px) {
    .container { max-width: 700px; }
    .books-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .flipbook { max-width: 600px; height: 76vh; height: 76dvh; }
  }

  /* الوضع الأفقي (Landscape) على الجوال */
  @media (orientation: landscape) and (max-height: 500px) {
    .navbar {
      padding: 4px 10px;
      padding-top: calc(4px + var(--safe-top));
      min-height: 44px;
    }
    .navbar h1 { font-size: 13px; }
    .navbar h1 span { font-size: 15px; }
    .btn-icon { width: 34px; height: 34px; min-height: 34px; font-size: 14px; }
    .container { padding: 8px; padding-bottom: calc(80px + var(--safe-bottom)); }
    .flipbook {
      height: 78vh;
      height: 78dvh;
      min-height: 220px;
      max-width: 380px;
    }
    .book-viewer { padding: 4px 0; }
    .viewer-controls { margin-top: 8px; gap: 6px; }
    .mobile-bottom-bar .btn { min-height: 40px; font-size: 10px; }
    .fab { bottom: calc(70px + var(--safe-bottom)); width: 50px; height: 50px; font-size: 24px; }
  }

  /* شاشات عالية الدقة */
  @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
    .book-card { box-shadow: var(--shadow-md); }
  }

  /* دعم RTL */
  [dir="rtl"] .form-group input[type="text"] { text-align: right; }
  [dir="ltr"] .form-group input[type="text"] { text-align: left; }

  /* تقليل الحركة لمن يفضّل ذلك */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* تحسين اللمس */
  @media (hover: none) {
    .btn:hover { background-color: inherit; }
    .book-card:hover { transform: none; box-shadow: var(--shadow-md); }
  }

  /* دعم الوضع الليلي للنظام */
  @media (prefers-color-scheme: dark) {
    body:not(.light-mode) {
      /* يمكن تفعيلها تلقائياً إن أردت */
    }
  }
</style>
</head>
<body>

<nav class="navbar">
  <h1><span>📚</span> كتابي <small>v5.2</small></h1>
  <div class="nav-actions">
    <button class="btn btn-light btn-icon" onclick="toggleDarkMode()" title="الوضع الليلي" aria-label="الوضع الليلي">🌙</button>
