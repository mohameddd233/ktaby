<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
<meta name="theme-color" content="#5c3d1f" />
<title>كتابي — نظام إنشاء الكتب  </title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@7.1.0/build/index.umd.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #8b5e34;
    --primary-dark: #5c3d1f;
    --primary-light: #b8895a;
    --accent: #d4a373;
    --bg: #f5f0e8;
    --card: #ffffff;
    --text: #2d2416;
    --muted: #8a7a68;
    --border: #e0d5c2;
    --danger: #c0392b;
    --success: #27ae60;
    --info: #3498db;
    --warning: #f39c12;
    --nav-h: 60px;
    --shadow-sm: 0 2px 8px rgba(139,94,52,0.08);
    --shadow-md: 0 4px 16px rgba(139,94,52,0.12);
    --shadow-lg: 0 10px 40px rgba(139,94,52,0.18);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
  }

  body.dark-mode {
    --primary: #d4a373;
    --primary-dark: #f0d5b0;
    --primary-light: #b8895a;
    --accent: #d4a373;
    --bg: #1a1a1a;
    --card: #2d2d2d;
    --text: #e0e0e0;
    --muted: #999;
    --border: #404040;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
  }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  .navbar {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    position: sticky;
    top: 0;
    z-index: 100;
    min-height: var(--nav-h);
    flex-wrap: wrap;
    gap: 8px;
  }
  .navbar h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; font-weight: 900; }
  .navbar h1 span { font-size: 24px; }
  .nav-actions { display: flex; gap: 6px; flex-wrap: wrap; }

  .btn {
    padding: 12px 18px;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s;
    min-height: 44px;
    user-select: none;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--primary-dark); }
  .btn-primary:hover:not(:disabled) { background: #e0b083; }
  .btn-light { background: rgba(255,255,255,0.2); color: white; }
  .btn-light:hover { background: rgba(255,255,255,0.3); }
  .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
  .btn-outline:hover { background: var(--primary); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-info { background: var(--info); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-sm { padding: 8px 12px; font-size: 13px; min-height: 38px; }
  .btn-xs { padding: 6px 10px; font-size: 12px; min-height: 32px; border-radius: 6px; }
  .btn-icon { padding: 8px; width: 40px; height: 40px; }

  .container { max-width: 1300px; margin: 0 auto; padding: 16px; width: 100%; flex: 1; }

  .library-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .library-header h2 { font-size: 22px; color: var(--primary-dark); }
  .library-header p { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .library-toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .library-toolbar input[type="text"] {
    flex: 1;
    min-width: 200px;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
  }
  .library-toolbar select {
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .book-card {
    background: var(--card);
    border-radius: var(--radius-md);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    transition: all 0.25s;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
  }
  .book-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .book-favorite {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(255,255,255,0.9);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
  }
  .book-favorite:hover { transform: scale(1.15); }
  .book-cover {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 40px;
    font-family: 'Amiri', serif;
    position: relative;
    overflow: hidden;
  }
  .book-cover::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.15), transparent 15%, transparent 85%, rgba(0,0,0,0.15));
    pointer-events: none;
  }
  .book-info { padding: 10px; flex: 1; display: flex; flex-direction: column; }
  .book-info h3 {
    font-size: 14px;
    margin-bottom: 4px;
    color: var(--primary-dark);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .book-info .author { font-size: 12px; color: var(--muted); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-info .meta { font-size: 11px; color: var(--muted); margin-top: auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }

  .card-actions {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: rgba(0,0,0,0.03);
    border-top: 1px solid var(--border);
  }
  .card-actions .btn { flex: 1; padding: 6px 2px; font-size: 11px; min-height: 34px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
  .empty-state h3 { font-size: 20px; margin-bottom: 8px; color: var(--primary-dark); }
  .empty-state p { margin-bottom: 20px; }

  .editor-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }

  .panel {
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 16px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 14px;
  }
  .panel h3 {
    color: var(--primary-dark);
    font-size: 16px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 6px;
  }
  .form-group input[type="text"],
  .form-group input[type="number"],
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 16px;
    background: var(--card);
    transition: border 0.2s;
    color: var(--text);
    min-height: 46px;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,163,115,0.15);
  }
  .form-group textarea { resize: vertical; min-height: 120px; line-height: 1.7; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  input[type="color"] { width: 100%; height: 46px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; padding: 4px; background: var(--card); }
  input[type="range"] { width: 100%; accent-color: var(--primary); height: 32px; }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); vertical-align: middle; margin-left: 6px; }

  .chapter-item {
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.2s, opacity 0.2s, transform 0.2s;
  }
  .chapter-item:hover { box-shadow: var(--shadow-sm); }
  .chapter-item.dragging { opacity: 0.4; transform: scale(0.98); }
  .chapter-item.drag-over { border-color: var(--accent); border-style: dashed; }
  .chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    background: rgba(139,94,52,0.06);
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    color: var(--primary-dark);
    min-height: 50px;
    gap: 6px;
  }
  .chapter-header span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .chapter-header .drag-handle { cursor: grab; color: var(--muted); padding: 0 4px; user-select: none; font-size: 16px; }
  .chapter-header .drag-handle:active { cursor: grabbing; }
  .chapter-body { padding: 12px; display: none; }
  .chapter-item.open .chapter-body { display: block; }

  .stats-box {
    background: linear-gradient(135deg, rgba(139,94,52,0.08), rgba(212,163,115,0.05));
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    margin-bottom: 14px;
  }
  .stats-box h4 { font-size: 14px; color: var(--primary-dark); margin-bottom: 10px; }
  .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat-item {
    background: var(--card);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .stat-item span:first-child { color: var(--muted); }
  .stat-item span:last-child { color: var(--primary-dark); font-weight: 700; }

  .measure-info {
    background: rgba(39,174,96,0.1);
    border: 1.5px solid var(--success);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--success);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .measure-info strong { color: var(--primary-dark); }

  .preview-page {
    background: var(--card);
    padding: 30px;
    border-radius: 4px;
    box-shadow: var(--shadow-lg);
    margin-bottom: 16px;
    min-height: 400px;
    position: relative;
    line-height: 1.8;
    overflow-wrap: break-word;
  }
  .preview-page.lined {
    background-image: repeating-linear-gradient(transparent, transparent 33px, #e5e7eb 34px);
    background-position: 0 30px;
  }
  .preview-page.dotted {
    background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .preview-page.vintage { background: #f5ecd7; }

  .preview-header, .preview-footer { font-size: 12px; color: #888; text-align: center; padding: 8px 0; }
  .preview-footer { border-top: 1px solid #eee; margin-top: 20px; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--card);
    border-radius: var(--radius-lg);
    max-width: 1200px;
    width: 100%;
    max-height: 94vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    gap: 10px;
  }
  .modal-header h3 { color: var(--primary-dark); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .close-btn {
    background: rgba(0,0,0,0.05);
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--muted);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .close-btn:hover { background: rgba(0,0,0,0.1); color: var(--primary-dark); }

  .book-viewer {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px 0;
    min-height: 600px;
    perspective: 3000px;
  }

  .flipbook {
    position: relative;
    width: 800px;
    height: 560px;
    margin: 0 auto;
    transform-style: preserve-3d;
    perspective: 2500px;
    transition: transform 0.5s ease;
  }

  .flipbook .leaf {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1),
                opacity 0.5s ease;
    cursor: pointer;
    will-change: transform;
  }

  .flipbook[data-dir="ltr"] .leaf {
    left: 50%;
    right: auto;
    transform-origin: left center;
    transform: rotateY(0deg);
  }
  .flipbook[data-dir="ltr"] .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .flipbook[data-dir="rtl"] .leaf {
    right: 50%;
    left: auto;
    transform-origin: right center;
    transform: rotateY(0deg);
  }
  .flipbook[data-dir="rtl"] .leaf.flipped {
    transform: rotateY(180deg);
  }

  .flipbook .leaf .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
    background: white;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
  }

  .flipbook[data-dir="ltr"] .leaf .face.front { border-radius: 4px 0 0 4px; }
  .flipbook[data-dir="ltr"] .leaf .face.back  { transform: rotateY(-180deg); border-radius: 0 4px 4px 0; }
  .flipbook[data-dir="rtl"] .leaf .face.front { border-radius: 0 4px 4px 0; }
  .flipbook[data-dir="rtl"] .leaf .face.back  { transform: rotateY(180deg); border-radius: 4px 0 0 4px; }

  .flipbook .leaf .page-content {
    flex: 1;
    padding: 32px;
    overflow: hidden;
    line-height: 1.9;
    overflow-wrap: break-word;
    word-wrap: break-word;
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    box-sizing: border-box;
  }

  .flipbook .leaf .page-header {
    font-size: 11px;
    color: #999;
    text-align: center;
    padding: 0 0 10px;
    flex-shrink: 0;
  }

  .flipbook .leaf .page-footer {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    padding: 10px 0 0;
    border-top: 1px solid #eee;
    flex-shrink: 0;
  }

  .flipbook .leaf .page-num {
    position: absolute;
    bottom: 12px;
    font-size: 12px;
    color: #999;
    pointer-events: none;
  }
  .flipbook[data-dir="ltr"] .leaf .face.front .page-num { left: 20px; }
  .flipbook[data-dir="ltr"] .leaf .face.back .page-num { right: 20px; }
  .flipbook[data-dir="rtl"] .leaf .face.front .page-num { right: 20px; }
  .flipbook[data-dir="rtl"] .leaf .face.back .page-num { left: 20px; }

  .flipbook-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, #d8cfb8, #f5efe4, #d8cfb8);
    border-radius: 6px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }

  .flipbook-bg::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    width: 6px;
    height: 100%;
    background: linear-gradient(90deg, rgba(0,0,0,0.15), rgba(0,0,0,0.05), rgba(0,0,0,0.15));
    transform: translateX(-50%);
    z-index: 1;
  }

  .cover-full {
    position: absolute !important;
    inset: 0;
    padding: 0 !important;
    margin: 0 !important;
    background: #000;
    border-radius: inherit;
    overflow: hidden;
  }

  .cover-full img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .flipbook.closed .leaf:not([data-index="0"]) {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }

  .flipbook.closed .leaf[data-index="0"] {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .flipbook[data-dir="rtl"].closed .leaf[data-index="0"] {
    right: 50%;
    left: auto;
    transform-origin: right center;
    transform: rotateY(0deg);
  }

  .flipbook[data-dir="ltr"].closed .leaf[data-index="0"] {
    left: 50%;
    right: auto;
    transform-origin: left center;
    transform: rotateY(0deg);
  }

  .flipbook.closed::after {
    content: '';
    position: absolute;
    top: 3%;
    bottom: 3%;
    width: 50%;
    pointer-events: none;
    z-index: 500;
    border-radius: inherit;
  }
  .flipbook[data-dir="rtl"].closed::after {
    right: 50%;
    background: linear-gradient(90deg, rgba(0,0,0,0.5) 0%, transparent 8%);
  }
  .flipbook[data-dir="ltr"].closed::after {
    left: 50%;
    background: linear-gradient(270deg, rgba(0,0,0,0.5) 0%, transparent 8%);
  }

  @keyframes coverPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(0,0,0,0.15); }
    50% { box-shadow: 0 0 40px rgba(212,163,115,0.5); }
  }

  .flipbook.closed .leaf[data-index="0"] .face.front {
    animation: coverPulse 2.5s ease-in-out infinite;
  }

  .flipbook.closed .leaf[data-index="0"] .face.front:hover {
    animation: none;
    box-shadow: 0 0 50px rgba(212,163,115,0.8);
  }

  .flipbook .leaf .face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(270deg, rgba(0,0,0,0.15), transparent 20%);
    opacity: 1;
    pointer-events: none;
    transition: opacity 0.5s;
  }

  .flipbook .leaf.flipped .face.front::after {
    opacity: 0;
  }

  .book-viewer.mobile-mode .flipbook {
    width: 100%;
    max-width: 400px;
    height: 78vh;
    min-height: 480px;
  }
  .book-viewer.mobile-mode .flipbook .leaf {
    width: 100%;
  }
  .book-viewer.mobile-mode .flipbook[data-dir="ltr"] .leaf {
    left: 0;
    right: auto;
  }
  .book-viewer.mobile-mode .flipbook[data-dir="rtl"] .leaf {
    right: 0;
    left: auto;
  }
  .book-viewer.mobile-mode .flipbook .leaf .page-content {
    padding: 20px;
    font-size: 15px;
  }
  .book-viewer.mobile-mode .flipbook-bg::before {
    display: none;
  }
  .book-viewer.mobile-mode .flipbook.closed::after {
    display: none;
  }

  .viewer-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .viewer-controls .btn { min-width: 140px; }
  .viewer-controls .btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .page-indicator {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-top: 12px;
    font-weight: 600;
    min-height: 20px;
  }

  .cover-preview {
    width: 100%;
    aspect-ratio: 3/4;
    max-height: 260px;
    border: 2px dashed var(--border);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    cursor: pointer;
    background: rgba(139,94,52,0.03);
    transition: all 0.2s;
  }
  .cover-preview:hover { border-color: var(--accent); background: rgba(139,94,52,0.08); }
  .cover-preview img { width: 100%; height: 100%; object-fit: cover; }

  .site-footer {
    background: linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: white;
    text-align: center;
    padding: 18px 16px;
    font-size: 13px;
    margin-top: auto;
  }
  .site-footer strong { color: var(--accent); font-weight: 700; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    background: rgba(139,94,52,0.06);
    padding: 4px;
    border-radius: var(--radius-sm);
    overflow-x: auto;
  }
  .tab {
    flex: 1;
    padding: 10px 8px;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    color: var(--muted);
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    white-space: nowrap;
    transition: all 0.2s;
    user-select: none;
  }
  .tab:hover { color: var(--primary-dark); }
  .tab.active { background: var(--card); color: var(--primary-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

  .hidden { display: none !important; }

  .toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--primary-dark);
    color: white;
    padding: 12px 22px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    font-size: 14px;
    z-index: 2000;
    transition: transform 0.3s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warning { background: var(--warning); }

  .fab {
    position: fixed;
    bottom: 90px;
    left: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border: none;
    font-size: 26px;
    box-shadow: 0 8px 24px rgba(139,94,52,0.4);
    cursor: pointer;
    z-index: 90;
    display: none;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  .fab:active { transform: scale(0.9); }

  .mobile-bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--card);
    border-top: 2px solid var(--border);
    padding: 8px 10px;
    display: none;
    gap: 8px;
    z-index: 95;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .mobile-bottom-bar .btn { flex: 1; font-size: 12px; padding: 8px 6px; }

  .preview-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding: 10px;
    background: rgba(139,94,52,0.06);
    border-radius: var(--radius-sm);
    flex-wrap: wrap;
  }
  .preview-indicator {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary-dark);
    min-width: 80px;
    text-align: center;
  }
  .preview-spread-container {
    perspective: 2000px;
  }
  .preview-spread {
    gap: 4px;
    justify-content: center;
    align-items: stretch;
    animation: fadeIn 0.3s ease;
    flex-wrap: nowrap;
  }
  .preview-spread-page {
    flex: 1;
    max-width: 50%;
    background: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    overflow: hidden;
    border-radius: 4px;
    min-height: 500px;
    position: relative;
  }
  .preview-spread[data-dir="rtl"] { flex-direction: row-reverse; }
  .preview-spread[data-dir="ltr"] { flex-direction: row; }

  .pdf-progress-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 3000;
    color: white;
    font-family: 'Cairo', sans-serif;
    gap: 20px;
  }
  .pdf-progress-spinner {
    width: 60px;
    height: 60px;
    border: 5px solid rgba(255,255,255,0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: pdfspin 1s linear infinite;
  }
  @keyframes pdfspin { to { transform: rotate(360deg); } }
  .pdf-progress-text {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    padding: 0 20px;
  }

  .bookmarks-panel {
    max-height: 300px;
    overflow-y: auto;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px;
    background: rgba(139,94,52,0.03);
  }
  .bookmark-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--card);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 13px;
    gap: 8px;
  }
  .bookmark-item .bm-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .toc-list {
    list-style: none;
    padding: 0;
  }
  .toc-list li {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 6px 0;
    border-bottom: 1px dotted var(--border);
    font-size: 14px;
  }
  .toc-list li .toc-title { font-weight: 600; color: var(--primary-dark); }
  .toc-list li .toc-page { color: var(--muted); font-size: 12px; }

  @media (max-width: 768px) {
    .navbar { padding: 10px 14px; }
    .navbar h1 { font-size: 17px; }
    .nav-actions .btn { padding: 8px 12px; font-size: 13px; }
    .nav-actions .btn .label-full { display: none; }

    .container { padding: 12px; padding-bottom: 80px; }
    .library-header > button { display: none; }
    .books-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .fab { display: flex; }

    .editor-layout { grid-template-columns: 1fr; gap: 12px; }
    .form-row { grid-template-columns: 1fr; }

    .mobile-bottom-bar { display: flex; }
    .editor-layout > div:last-child { padding-bottom: 70px; }

    .modal-overlay { padding: 0; align-items: stretch; }
    .modal { max-height: 100vh; height: 100vh; border-radius: 0; padding: 14px; }
    .stats-grid { grid-template-columns: 1fr; }
    .book-viewer { padding: 10px 0; min-height: auto; }

    .preview-spread { flex-direction: column !important; }
    .preview-spread-page { max-width: 100%; min-height: 400px; }
  }

  @media (max-width: 380px) {
    .books-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <h1><span>📚</span> كتابي <small style="font-size:11px;opacity:0.7">v5.1</small></h1>
  <div class="nav-actions">
    <button class="btn btn-light" onclick="goHome()">🏠 <span class="label-full">المكتبة</span></button>
    <button class="btn btn-light" onclick="toggleDarkMode()" title="الوضع الليلي">🌙</button>
    <button class="btn btn-light" onclick="exportAllBooks()" title="نسخة احتياطية">💾</button>
    <button class="btn btn-light" onclick="document.getElementById('importAllInput').click()" title="استيراد">📥</button>
    <button class="btn btn-primary" onclick="createNewBook()">➕ <span class="label-full">كتاب جديد</span></button>
  </div>
  <input type="file" id="importAllInput" accept=".json" class="hidden" onchange="importAllBooks(event)">
</nav>

<div class="container" id="app"></div>

<button class="fab" id="fab" onclick="createNewBook()">+</button>

<footer class="site-footer">
  Designed and Programming by <strong>Mohamed Ali</strong> © 2026 — v5.1
</footer>

<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<div class="mobile-bottom-bar hidden" id="mobileBar">
  <button class="btn btn-success" onclick="saveCurrentBook()">💾 حفظ</button>
  <button class="btn btn-primary" onclick="openViewer(currentEditingId)">👁️ عرض</button>
  <button class="btn btn-outline" onclick="exportPDF(currentEditingId)">📄 PDF</button>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
